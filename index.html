  if(f.size>4.5*1024*1024){alert('La imagen es muy grande (máximo 4.5 MB).');input.value='';return;}

  rd.onload=function(){var url=rd.result;var m=/^data:([^;]+);base64,(.*)$/.exec(url);
    window._iaImg={mime:m?m[1]:'image/png',data:m?m[2]:'',url:url};re();};

      var om=msgs.map(function(m,i){
        if(i===msgs.length-1&&img)return {role:m.role,content:[{type:'text',text:userText},{type:'image_url',image_url:{url:img.url}}]};
        return {role:m.role,content:m.content};

    else{

    msgs.push({role:'assistant',content:resp});
  }catch(e){msgs.push({role:'assistant',content:'Error: '+e.message});}
  setIaMsgs(msgs);S.iaScroll=Date.now();re();

function parseMesFromFecha(fecha){
  if(!fecha)return null;
  let s=String(fecha).trim();
  // ISO: 2025-02-05
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return parseInt(s.split('-')[1]);
  // DD/MM/YYYY
  if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s))return parseInt(s.split('/')[1]);
  // DD/MM/YY
  if(/^\d{1,2}\/\d{1,2}\/\d{2}/.test(s))return parseInt(s.split('/')[1]);
  return null;
}

function buildTribResumen(){
  // Build monthly data from RCV + Ventas + manual ingresos
  const e=emp();
  const allRCV=(e.rcvData&&e.rcvData.length>0)?e.rcvData:parseRCV(e.rcvTxt||'').filter(r=>r.estado==='CONSOLIDADO');
  const allVentas=e.ventasData||[];
  const months=Array.from({length:12},(_,i)=>({mes:i+1,compras:0,ventas:0,cfIVA:0,dfIVA:0,ivaAPagar:0,cfDisponible:0,itAPagar:0}));

  // CF inicial de apertura → se suma en Enero (mes 1)
  const cfApertura=r2(pn(emp().traspaso.cfIva||0));
  if(cfApertura>0){months[0].cfIVA=r2(months[0].cfIVA+cfApertura);}
  // RCV → Total Compras por mes
  allRCV.forEach(r=>{
    const m=parseMesFromFecha(r.fecha);
    if(m>=1&&m<=12){
      const totalN=r2(r.total-(r.ice||0)-(r.iehd||0)-(r.ipj||0)-(r.tasas||0));
      months[m-1].compras=r2(months[m-1].compras+totalN);
      // CF: 13% de compras (o 70%*13% si combustible)
      let cf;
      if(r.noSujeto>0){const b70=r2(totalN*0.70);cf=r.derechoCF==='SI'?r2(b70*0.13):0;}
      else{cf=r.derechoCF==='SI'?r2(totalN*0.13):0;}
      months[m-1].cfIVA=r2(months[m-1].cfIVA+cf);
    }
  });

  // Ventas → Total Ventas + DF IVA + IT por mes
  allVentas.forEach(v=>{
    const m=parseMesFromFecha(v.fecha);
    if(m>=1&&m<=12){
      const tot=r2(v.total);
      months[m-1].ventas=r2(months[m-1].ventas+tot);
      months[m-1].dfIVA=r2(months[m-1].dfIVA+r2(tot*0.13));
      months[m-1].itAPagar=r2(months[m-1].itAPagar+r2(tot*0.03));
    }
  });
  // Manual ingresos → also add by month
  (e.ingresos||[]).forEach(ing=>{
    const m=+(ing.mes||1);const tot=r2(pn(ing.monto));if(!tot)return;
    if(m>=1&&m<=12){
      months[m-1].ventas=r2(months[m-1].ventas+tot);
      months[m-1].dfIVA=r2(months[m-1].dfIVA+r2(tot*0.13));
      months[m-1].itAPagar=r2(months[m-1].itAPagar+r2(tot*0.03));
    }
  });

  // CF inicial de apertura en Enero hace que cfDisponible suba
  // Calculate IVA neto por mes
  months.forEach(m=>{
    const neto=r2(m.dfIVA-m.cfIVA);
    m.ivaAPagar=neto>0?neto:0;
    m.cfDisponible=neto<0?Math.abs(neto):0;
  });
  return months;
}

  const totDF=r2(data.reduce((s,m)=>r2(s+m.dfIVA),0));
  const totIVA=r2(data.reduce((s,m)=>r2(s+m.ivaAPagar),0));
  const totIT=r2(data.reduce((s,m)=>r2(s+m.itAPagar),0));
  const totCFDis=r2(data.reduce((s,m)=>r2(s+m.cfDisponible),0));

// ─── Account override setters ─────────────────────────
function rcSet(code,sdId){
  sdSet(code,sdId);
  // Extract index from sdId (format: 'rc{idx}')
  var idx=parseInt(sdId.replace('rc',''));
  if(!isNaN(idx)){
    if(!emp().rcvOverrides)emp().rcvOverrides={};
    emp().rcvOverrides[idx]=code;
    saveLS();re();
  }
}
function deleteRCVRow(idx){
  var e=emp();
  if(!e.rcvData||!e.rcvData.length){alert('Solo se pueden eliminar registros individuales cuando cargaste un archivo XLSX. En modo pegado, edita el texto directamente.');return;}
  if(!confirm('¿Eliminar este registro del RCV? (no borra el resto)'))return;
  e.rcvData.splice(idx,1);
  // Reindexar overrides guardados en la empresa
  if(e.rcvOverrides){var o={};Object.keys(e.rcvOverrides).forEach(function(k){var n=+k;if(n===idx)return;o[n>idx?n-1:n]=e.rcvOverrides[k];});e.rcvOverrides=o;}
  // Reindexar pagos y comentarios (localStorage por empresa)
  ['cx_rcv_pay_','cx_rcv_cmt_'].forEach(function(pre){
    var key=pre+S.activeId;var raw=localStorage.getItem(key);if(!raw)return;
    try{var m=JSON.parse(raw);var out={};Object.keys(m).forEach(function(k){var n=+k;if(n===idx)return;out[n>idx?n-1:n]=m[k];});localStorage.setItem(key,JSON.stringify(out));}catch(er){}
  });
  saveLS();re();
}
function addRcvNit(idx){
  var e=emp();
  var arr=(e.rcvData&&e.rcvData.length)?e.rcvData:parseRCV(e.rcvTxt||'').filter(function(r){return r.estado==='CONSOLIDADO';});
  var r=arr[idx];if(!r)return;
  var nit=(''+(r.nit||'')).trim();var razon=(r.razon||'').trim();
  if(!nit){alert('Esta factura no tiene NIT.');return;}
  var overrides=e.rcvOverrides||{};
  var lk=nitLookup(nit);var autoCode=lk?lk.cuenta:(CAT_MAP[(r.cat||'').trim()]||'526002001');
  var code=overrides[idx]||autoCode;
  if(!S.nits)S.nits=[];
  var ex=S.nits.findIndex(function(n){return String(n.nit)===String(nit);});
  if(ex>=0)S.nits[ex]={nit:nit,razon:razon||S.nits[ex].razon,cat:S.nits[ex].cat||(r.cat||''),cuenta:code};
  else S.nits.push({nit:nit,razon:razon,cat:(r.cat||''),cuenta:code});
  saveLS();
  if(typeof showNotif==='function')showNotif('✓ NIT '+nit+' guardado en NIT\'s ('+acctName(code)+')');
  re();
}

// ─── Helpers para AFV con fecha ──────────────────────────────
function getUFVForDate(fecha){
  if(!fecha||!S.ufvData||S.ufvData.length===0)return null;
  let iso=String(fecha).trim();
  // DD/MM/YYYY → YYYY-MM-DD
  if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(iso)){
    const p=iso.split('/');iso=p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');
  }
  // Serial date (Excel) → skip
  if(/^\d+$/.test(iso))return null;
  const found=S.ufvData.find(u=>u.fecha===iso);
  return found?pn(found.ufv):null; // pn entiende coma decimal ("2,81402" → 2.81402)
}

function getMesesDesde(fechaCompra, fechaFin){
  // Meses de uso desde la compra hasta el fin del período.
  // Regla del día 15: si se compra el día 15 o antes, cuenta el mes de compra completo;
  // si se compra después del 15, la depreciación empieza el mes siguiente.
  if(!fechaCompra)return 12;
  let sC=String(fechaCompra).trim(),sF=String(fechaFin||'').trim();
  let dC,mC,yC,mF,yF;
  if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(sC)){const p=sC.split('/');dC=parseInt(p[0]);mC=parseInt(p[1]);yC=parseInt(p[2]);}
  else if(/^\d{4}-\d{2}-\d{2}/.test(sC)){const p=sC.split('-');yC=parseInt(p[0]);mC=parseInt(p[1]);dC=parseInt(p[2]);}
  else return 12;
  if(/^\d{4}-\d{2}-\d{2}/.test(sF)){const p=sF.split('-');yF=parseInt(p[0]);mF=parseInt(p[1]);}
  else{yF=new Date().getFullYear();mF=12;}
  let mesInicio=mC;
  if(dC>15)mesInicio=mC+1; // comprado después del 15 → empieza el mes siguiente
  const meses=(yF-yC)*12+(mF-mesInicio)+1;
  return Math.max(0,Math.min(12,meses));
}

function getAFFromApertura(){
  const tr=emp().traspaso;
  const ui=pn(emp().cfg.ufvInicio),uf=pn(emp().cfg.ufvFin);
  const uR=ui>0?(uf/ui):1;   // coeficiente UFV con precisión completa (no redondear a 2 decimales)
  const defs=getAFTipos();
  const items=[];
  // ── Activos de gestiones anteriores (Asiento de Apertura) ──
  // Actualización con UFV inicio (31/12 año anterior) / UFV fin. Depreciación año completo.
  defs.forEach(d=>{
    if(!d.k)return;
    const vH=r2(pn(tr[d.k]||0));
    if(!vH)return;
    const anios=pn(d.anios)||1;
    const dAP=r2(pn(tr[d.kD]||0));
    const ajA=ui>0?r2(vH*(uR-1)):0;
    const vAct=r2(vH+ajA);
    const dep=r2(vAct/anios);                 // depreciación de un año completo (valor actualizado / años)
    const ajD=ui>0?r2(dAP*(uR-1)):0;          // actualización de la depreciación acumulada anterior
    const jVal=r2(dAP+ajD);
    items.push({tipo:d.tipo,nombre:d.tipo,fuente:'Apertura',anios:anios,meses:12,
      ufvIni:ui,ufvFin:uf,coef:uR,baseNeto:vH,
      vH,dAP,ajA,vAct,dep,ajD,jVal,dTotal:r2(jVal+dep),vNeto:r2(vAct-r2(jVal+dep)),
      tasa:(pn(d.pct)||0)/100,cA:d.cA,cD:d.cD,cG:d.cG});
  });
  // ── Activos comprados en la gestión (RCV Compras) ──
  // Valor = 87% del importe. Actualización con UFV del día de compra / UFV fin.
  // Depreciación proporcional a los meses de uso (regla del día 15).
  const allRCV=(emp().rcvData&&emp().rcvData.length>0)?emp().rcvData:[];
  const AFcodes={};defs.forEach(d=>{if(d.cA)AFcodes[d.cA]=d.tipo;});
  const cfg=emp().cfg;
  allRCV.forEach((r,i)=>{
    const overrides=emp().rcvOverrides||{};
    const lk=nitLookup(r.nit);
    const autoCode=lk?lk.cuenta:(CAT_MAP[r.cat?.trim()]||'526002001');
    const code=overrides[i]||autoCode;
    if(!AFcodes[code])return;
    const def=defs.find(d=>d.cA===code);if(!def)return;
    const anios=pn(def.anios)||1;
    // Valor neto del activo = 87% del importe (el 13% de IVA es crédito fiscal, no se activa)
    const baseNeto=r2(r.total-(r.ice||0)-(r.iehd||0)-(r.ipj||0)-(r.tasas||0));
    const vH=r2(baseNeto*0.87);
    if(!vH)return;
    // UFV específica del día de compra
    const ufvCompra=getUFVForDate(r.fecha)||uf; // fallback: UFV fin período
    const uRcv=uf>0&&ufvCompra>0?(uf/ufvCompra):1; // coeficiente UFV con precisión completa
    const ajA=ufvCompra>0&&uRcv!==1?r2(vH*(uRcv-1)):0;
    const vAct=r2(vH+ajA);
    // Depreciación proporcional a los meses de uso
    const meses=getMesesDesde(r.fecha,cfg.fechaFin);
    const dep=r2(vAct/anios*(meses/12));
    const label=def.tipo+' — '+(r.fecha||'')+(r.razon?' ('+r.razon.substring(0,20)+')':'');
    items.push({
      tipo:def.tipo,nombre:label,fuente:'RCV',
      fecha:r.fecha,ufvCompra,meses,anios:anios,
      ufvIni:ufvCompra,ufvFin:uf,coef:uRcv,baseNeto:baseNeto,
      vH,dAP:0,ajA,vAct,dep,ajD:0,jVal:0,
      dTotal:dep,vNeto:r2(vAct-dep),
      tasa:(pn(def.pct)||0)/100,cA:def.cA,cD:def.cD,cG:def.cG
    });
  });
  // ── Activos comprados vía Asiento Libre (Otros Asientos con FECHA + tipo AF) ──
  // Mismo procedimiento que el RCV: UFV del día de compra, depreciación proporcional a meses.
  (emp().otrosAsientos||[]).forEach(function(oa){
    if(oa.fixed||!oa.activo)return;
    if(!oa.afTipo||!oa.fecha)return;
    var def=defs.find(function(d){return d.tipo===oa.afTipo;});
    if(!def)return;
    var anios=pn(def.anios)||1;
    // Valor histórico = Debe en la cuenta del activo (def.cA); si no coincide, total Debe del asiento
    var vHca=0,vHtot=0;
    (oa.lines||[]).forEach(function(l){var v=pn(l.v);if(l.t==='D'){vHtot=r2(vHtot+v);if(l.c===def.cA)vHca=r2(vHca+v);}});
    var vH=vHca>0?vHca:vHtot;
    if(!vH)return;
    var ufvCompra=getUFVForDate(oa.fecha)||uf;
    var uRcv=uf>0&&ufvCompra>0?(uf/ufvCompra):1;
    var ajA=ufvCompra>0&&uRcv!==1?r2(vH*(uRcv-1)):0;
    var vAct=r2(vH+ajA);
    var meses=getMesesDesde(oa.fecha,cfg.fechaFin);
    var dep=r2(vAct/anios*(meses/12));
    var label=def.tipo+' — '+(oa.fecha||'')+(oa.comentario?' · '+oa.comentario:'')+' (asiento libre'+(oa.nombre?': '+oa.nombre:'')+')';
    items.push({
      tipo:def.tipo,nombre:label,fuente:'Asiento Libre',
      fecha:oa.fecha,ufvCompra:ufvCompra,meses:meses,anios:anios,
      ufvIni:ufvCompra,ufvFin:uf,coef:uRcv,baseNeto:vH,
      vH:vH,dAP:0,ajA:ajA,vAct:vAct,dep:dep,ajD:0,jVal:0,
      dTotal:dep,vNeto:r2(vAct-dep),
      tasa:(pn(def.pct)||0)/100,cA:def.cA,cD:def.cD,cG:def.cG
    });
  });
  return items;
}

function calcCompensaciones(c){
  const{gs,M}=c;
  const ui=pn(emp().cfg.ufvInicio),uf=pn(emp().cfg.ufvFin);
  const uR=ui>0?(uf/ui):1;

  // Current balances FROM MAYORES (antes de compensar)
  const cfSaldo  = r2(gs('116001001')); // Crédito Fiscal IVA (activo)
  const dfSaldo  = r2(gs('214001001')); // Débito Fiscal IVA (pasivo)
  const itSaldo  = r2(gs('214004001')); // IT Por Pagar
  const iuePagar = r2(gs('214006001')); // IUE Por Pagar
  const iueComp  = r2(gs('116006001')); // IUE A Compensar
  const multas   = r2(gs('214026001')); // Multas e Intereses

  // PASO 1: Ajuste CF con UFV (si hay UFVs configurados)
  const ajCF = ui>0 ? r2(cfSaldo*(uR-1)) : 0;
  const cfActualizado = r2(cfSaldo + ajCF);

  // PASO 2: Compensación DF vs CF
  const compCFDF = r2(Math.min(dfSaldo, cfActualizado));
  const dfRestante = r2(dfSaldo - compCFDF);
  const cfRestante = r2(cfActualizado - compCFDF);

  // PASO 3: Pago IT con caja/banco
  // Se puede usar IUE A Compensar para pagar IT
  const iueParaIT = r2(Math.min(iueComp, itSaldo));
  const itConCaja = r2(itSaldo - iueParaIT);

  // PASO 4: DF restante se paga con caja
  const dfConCaja = dfRestante;

  // PASO 5: Multas se pagan con caja
  const multasConCaja = multas;

  // Total a pagar con caja
  const totalCaja = r2(dfConCaja + itConCaja + multasConCaja);

  return{cfSaldo,dfSaldo,itSaldo,iuePagar,iueComp,multas,
         ajCF,cfActualizado,compCFDF,dfRestante,cfRestante,
         iueParaIT,itConCaja,dfConCaja,multasConCaja,totalCaja};
}

        '<span style="font-size:10px;color:var(--nm-texto,#163832);font-weight:600">Datos del sistema:</span>'+
        (calcDF>0?'<button onclick="setComp('+mes+',\'compDF\','+calcDF+');re()" style="background:var(--nm-fondo,#F4FAF5);border:1px solid var(--nm-texto,#163832);border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer;color:var(--nm-texto,#163832);font-weight:600">DF → '+fmt(calcDF)+'</button>':'')+
        (calcCF>0?'<button onclick="setComp('+mes+',\'compCF\','+calcCF+');re()" style="background:var(--nm-ok-bg,#DAF1DE);border:1px solid var(--nm-ok,#235347);border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer;color:var(--nm-ok,#235347);font-weight:600">CF → '+fmt(calcCF)+'</button>':'')+
        (calcIT>0?'<button onclick="setComp('+mes+',\'compIT\','+calcIT+');re()" style="background:var(--nm-aviso-bg,#FDF3E4);border:1px solid var(--nm-aviso-borde,#EBC79B);border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer;color:var(--nm-aviso,#93370D);font-weight:600">IT → '+fmt(calcIT)+'</button>':'')+

      '</div>':
          '<span style="font-size:10px;color:var(--nm-suave,#557363)">Sin datos calculados (carga RCV y Ventas)</span>')+
      '</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
        asientoBlock('COMPENSACIONES (DF / CF / IT / IUE / Multas)','#163832',compRows,totD_comp,totH_comp)+
        asientoBlock('AJUSTE CRÉDITO FISCAL (del SIN)','#163832',ajRows,ajcf,ajufv)+
      '</div>'+
      '<div style="margin-top:8px;display:flex;align-items:center;gap:6px">'+
        '<label style="font-size:10px;color:var(--nm-suave,#557363)">Comentario:</label>'+
        '<input type="text" value="'+(m.comentario||'')+'" placeholder="Ej: CF no alcanzó, pago parcial..." '+
        'onblur="setComp('+mes+',\'comentario\',this.value)" '+
        'style="background:transparent;border:none;border-bottom:1px solid var(--nm-borde,#DAF1DE);font-size:11px;flex:1;outline:none;padding:2px 4px"/>'+
      '</div>'+
    '</div>';
  }).join('');

  const totDF=r2(data.reduce((s,m)=>r2(s+pn(m.compDF)),0));
  const totCF=r2(data.reduce((s,m)=>r2(s+pn(m.compCF)),0));
  const totIT=r2(data.reduce((s,m)=>r2(s+pn(m.compIT)),0));
  const totCaja=r2(data.reduce((s,m)=>r2(s+pn(m.compCaja)),0));

  return '<div class="card"><div class="h2"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:5px"><path d="M12 3v18M6 21h12"/><path d="M6 6l-3 6a3 3 0 006 0zM18 6l-3 6a3 3 0 006 0z"/><path d="M6 6l6-1 6 1"/></svg>Compensaciones por Mes</div>'+
    '<p class="nota">Los campos DF, CF e IT muestran un botón con el valor calculado del sistema (→ clic para aplicar). IUE, Multas y Caja se ingresan siempre de forma manual. El Ajuste CF viene del portal SIN (Cuenta Corriente).</p>'+
    '<div style="background:var(--nm-fuerte,#163832);color:var(--nm-sobre-fuerte,#FFFFFF);border-radius:8px;padding:10px;margin-bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11px">'+
      '<div><div style="opacity:.6;font-size:9px">DF Total</div><div style="font-weight:700">'+fmt(totDF)+' Bs</div></div>'+
      '<div><div style="opacity:.6;font-size:9px">CF Total</div><div style="font-weight:700">'+fmt(totCF)+' Bs</div></div>'+
      '<div><div style="opacity:.6;font-size:9px">IT Total</div><div style="font-weight:700">'+fmt(totIT)+' Bs</div></div>'+
      '<div><div style="opacity:.6;font-size:9px">Caja Total</div><div style="font-weight:700;color:var(--nm-error,#B42318)">'+fmt(totCaja)+' Bs</div></div>'+
    '</div>'+
    months+
  '</div>'+
  auxPanel('Cálculos auxiliares — Compensaciones','compAuxOpen',compAuxInner(c));
}

// ═══ SPLASH SCREEN ══════════════════════════════════════
function renderSplash(){
  const cfg=emp().cfg;const c=calcAll();
  var cu=getCurrentUser&&getCurrentUser();
  var nombre=(cu&&cu.nombre)||getUser();
  var pila=nmClasicos();var _d=new Date();var foto=pila[(_d.getDate()+_d.getMonth()*31)%pila.length];
  var h=new Date().getHours();var saludo=h<12?'Buenos días':(h<19?'Buenas tardes':'Buenas noches');
  function kpi(lbl,val,neg){return '<div class="nm-kpi"><small>'+lbl+'</small><b'+(neg?' class="neg"':'')+'>'+val+'</b></div>';}
  var kpis=cfg.razonSocial?
    '<div class="nm-kpis">'+
      kpi('Ingresos del período','Bs '+fmt(c.tI||0))+
      kpi('Resultado',(c.util<0?'−':'')+'Bs '+fmt(Math.abs(c.util||0)),c.util<0)+
      kpi('Gestión',cfg.gestion||'—')+
    '</div>':
    '<div class="info ib" style="margin:0">Elige o crea una empresa con el botón de empresas, arriba a la derecha.</div>';
  return '<div class="nm-inicio">'+
    '<section class="nm-inicio-hero"><div class="nm-patron" aria-hidden="true"></div>'+
      '<img class="nm-inicio-logo" src="'+(S.darkMode?CONTAX_ISOTIPO_NEG:CONTAX_ISOTIPO)+'" alt="NUMMEROS by CONTAX"/>'+
      '<div><h1>'+saludo+', '+String(nombre).split(' ')[0]+'.</h1>'+
        '<p>'+(cfg.razonSocial?('Estás trabajando en <strong style="color:var(--nm-texto)">'+cfg.razonSocial+'</strong> · NIT '+(cfg.nit||'—')+'.'):'Sistemas a la medida de tu empresa.')+'</p></div>'+
      kpis+
    '</section>'+
    '<figure class="nm-inicio-foto" style="margin:0"><img src="'+foto.img+'"'+(foto.pos?' style="object-position:'+foto.pos+'"':'')+' alt="'+foto.nombre+', escultura griega de mármol, trabajando con NUMMEROS"/>'+
      '<figcaption>'+nmNombre(foto)+'</figcaption></figure>'+
  '</div>'+
  '<div class="nm-inicio-pie"><span>NUMMEROS by CONTAX · Sistema Contable '+VERSION+'</span><span>Montos expresados en bolivianos.</span></div>';
}

// ═══ CUENTAS POR COBRAR ═══════════════════════════════
function getCxC(){var s=localStorage.getItem('cx_cxc_'+S.activeId);return s?JSON.parse(s):[];}
function saveCxC(d){localStorage.setItem('cx_cxc_'+S.activeId,JSON.stringify(d));}
function cobrarCxC(idx,forma){var d=getCxC();if(!d[idx])return;d[idx].estado='cobrado';d[idx].formaPago=forma;d[idx].fechaCobro=new Date().toLocaleDateString('es-BO');saveCxC(d);re();}
function pendienteCxC(idx){var d=getCxC();if(!d[idx])return;d[idx].estado='pendiente';delete d[idx].formaPago;delete d[idx].fechaCobro;saveCxC(d);re();}
function addCxC(){var d=getCxC();var r=prompt('Cliente/Razón Social:')||'';var m=pn(prompt('Monto (Bs):')||'0');if(!r)return;d.push({razon:r,monto:m,fecha:new Date().toLocaleDateString('es-BO'),nroDoc:'',cuenta:'113001001',estado:'pendiente'});saveCxC(d);re();}
function cobrarSelCxC(){var d=getCxC();d.forEach(function(_,i){var cb=document.getElementById('cxc-cb-'+i);var sel=document.getElementById('cxc-pay-'+i);if(cb&&cb.checked&&d[i].estado!=='cobrado'){d[i].estado='cobrado';d[i].formaPago=sel?sel.value:'efectivo';d[i].fechaCobro=new Date().toLocaleDateString('es-BO');}});saveCxC(d);re();}
function autoAddCxC(idx,tipo,razon,monto,fecha){if(tipo!=='porcobrar')return;var d=getCxC();if(d.some(function(x){return x.ventasIdx===idx;}))return;d.push({ventasIdx:idx,razon:razon||'Cliente',monto:r2(monto)||0,fecha:fecha||'',nroDoc:'',cuenta:'113001001',estado:'pendiente'});saveCxC(d);}

function renderCxC(){
  var data=getCxC();
  // Auto-sync from ventas with 'porcobrar'
  var ventas=emp().ventasData||[];var pays=getVentasPayments();
  ventas.forEach(function(v,i){if(pays[i]==='porcobrar')autoAddCxC(i,'porcobrar',v.razon,v.total,v.fecha);});
  data=getCxC();
  var pend=data.filter(function(x){return x.estado!=='cobrado';});
  var totPend=r2(pend.reduce(function(s,x){return r2(s+pn(x.monto));},0));
  var totCob=r2(data.filter(function(x){return x.estado==='cobrado';}).reduce(function(s,x){return r2(s+pn(x.monto));},0));
  function row(item,idx){
    var pag=item.estado==='cobrado';
    return '<tr style="background:'+(pag?'#DAF1DE':(idx%2?'#F4FAF5':'#fff'))+'">'+
      '<td><input type="checkbox" id="cxc-cb-'+idx+'" style="width:13px;height:13px"/></td>'+
      '<td style="font-size:10px">'+idx+'</td>'+
      '<td style="font-size:11px">'+acctName(item.cuenta||'113001001')+'</td>'+
      '<td style="font-size:11px">'+item.razon+'</td>'+
      '<td style="font-size:10px">'+item.fecha+'</td>'+
      '<td style="font-size:10px">'+(item.nroDoc||'—')+'</td>'+
      '<td class="r" style="font-family:Akshar,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em">'+fmt(pn(item.monto))+'</td>'+
      '<td><span class="'+(pag?'badge-ok':'badge-err')+'">'+(pag?'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.12em"><path d="M20 6L9 17l-5-5"/></svg> Cobrado':'Pendiente')+'</span></td>'+
      (pag?
        '<td style="font-size:10px">'+(item.comentario||'—')+'</td>'+
        '<td style="font-size:10px">'+(item.fechaPago||item.fechaCobro||'')+'</td>'+
        '<td style="font-size:10px">'+(item.formaPago||'')+'</td>'+
        '<td><button class="btn-del" style="font-size:10px;padding:3px 6px" onclick="pendienteCxC('+idx+')"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3M3 4v5h5"/></svg></button></td>':
        '<td style="min-width:80px"><input type="text" value="'+(item.comentario||'')+'" placeholder="Nota..." onblur="var d=getCxC();d['+idx+'].comentario=this.value;saveCxC(d)" style="font-size:10px;width:100%;border:1px solid var(--nm-borde,#DAF1DE);border-radius:4px;padding:2px"/></td>'+
        '<td style="min-width:90px"><input type="date" value="'+(item.fechaPago||'')+'" onchange="var d=getCxC();d['+idx+'].fechaPago=this.value;saveCxC(d)" style="font-size:10px;width:100%;border:1px solid var(--nm-borde,#DAF1DE);border-radius:4px;padding:2px"/></td>'+
        '<td><select id="cxc-pay-'+idx+'" style="font-size:10px;border:1px solid var(--nm-borde,#DAF1DE);border-radius:4px;padding:2px;background:var(--nm-campo,#EEF7F0)">'+
          '<option value="efectivo">Efectivo</option><option value="qr">QR</option><option value="transferencia">Transferencia</option>'+
        '</select></td>'+
        '<td><button class="btn-green" style="font-size:10px;padding:3px 8px" onclick="var s=document.getElementById(\'cxc-pay-'+idx+'\');cobrarCxC('+idx+',s?s.value:\'efectivo\')"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.12em"><path d="M20 6L9 17l-5-5"/></svg> Cobrar</button></td>')+
    '</tr>';
  }
  var rows=data.map(function(item,i){return row(item,i);}).join('');
  return '<div class="card"><div class="h2"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:5px"><path d="M12 3v9M8.5 8.5L12 12l3.5-3.5"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>Cuentas por Cobrar</div>'+
    '<p class="nota">Facturas de ventas marcadas como "Por Cobrar". Al cobrar se refleja en los estados financieros.</p>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">'+
      '<div style="background:var(--nm-error-bg,#FDECEA);border-radius:8px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:700;color:var(--nm-error,#B42318)">'+fmt(totPend)+'</div><div style="font-size:10px;color:var(--nm-error,#B42318)">Pendiente de cobro</div></div>'+
      '<div style="background:var(--nm-ok-bg,#DAF1DE);border-radius:8px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:700;color:var(--nm-ok,#235347)">'+fmt(totCob)+'</div><div style="font-size:10px;color:var(--nm-ok,#235347)">Cobrado</div></div>'+
      '<div style="background:var(--nm-fondo,#F4FAF5);border-radius:8px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:700;color:var(--nm-texto,#163832)">'+pend.length+'</div><div style="font-size:10px;color:var(--nm-texto,#163832)">Facturas pendientes</div></div>'+

function saveCxP(d){localStorage.setItem('cx_cxp_'+S.activeId,JSON.stringify(d));}
function pagarCxP(idx,forma){var d=getCxP();if(!d[idx])return;d[idx].estado='pagado';d[idx].formaPago=forma;d[idx].fechaPago=new Date().toLocaleDateString('es-BO');saveCxP(d);re();}
function pendienteCxP(idx){var d=getCxP();if(!d[idx])return;d[idx].estado='pendiente';delete d[idx].formaPago;delete d[idx].fechaPago;saveCxP(d);re();}
function addCxP(){var d=getCxP();var r=prompt('Proveedor/Razón Social:')||'';var m=pn(prompt('Monto (Bs):')||'0');if(!r)return;d.push({proveedor:r,monto:m,fecha:new Date().toLocaleDateString('es-BO'),nroDoc:'',estado:'pendiente'});saveCxP(d);re();}

function renderVerificaciones(c){

  // 1. Balance General cuadra

  // 3. Todos los asientos balancean (debe = haber por asiento)
  var unbalanced=E.filter(function(entry){
    var d=entry.lines.reduce(function(s,l){return s+(l.d||0);},0);

    return Math.abs(d-h)>0.01;
  });
  var entriesOk=unbalanced.length===0;

  // 8. IUE provisionado
  var iueEntry=E.find(function(en){return en.id==='IUE';});
  var iueOk=util<=0||!!iueEntry;
  
  // 9. Cuentas por cobrar = CxC pendientes
  var cxcBalance=gs('113001001')||0;
  var cxcPend=r2((getCxC()||[]).filter(function(x){return x.estado!=='cobrado';}).reduce(function(s,x){return s+pn(x.monto);},0));
  var cxcOk=Math.abs(cxcBalance-cxcPend)<1||cxcPend===0;
  
  // 10. Cuentas por pagar = CxP pendientes
  var cxpBalance=gs('212004001')||0;
  var cxpPend=r2((getCxP()||[]).filter(function(x){return x.estado!=='pagado';}).reduce(function(s,x){return s+pn(x.monto);},0));
  var cxpOk=Math.abs(cxpBalance-cxpPend)<1||cxpPend===0;
  
  // ═══ CUADRE DE LOS 6 ESTADOS FINANCIEROS (V54) ═══
  var trp=(e.traspaso||{});
  var capT=r2(pn(trp.capitalSocial)+pn(trp.ajusteCapital));
  var resA=r2(pn(trp.resAcum));
  var _vuiPT=pn(e.cfg&&e.cfg.ufvInicio),_vufPT=pn(e.cfg&&e.cfg.ufvFin),_uRPT=_vuiPT>0?(_vufPT/_vuiPT):1;
  var ajRAPT=(_vuiPT>0&&resA>0)?r2(resA*(_uRPT-1)):0;
  var patFinal=r2(capT+(c.ajC||0)+resA+ajRAPT+util);
  var afList=(typeof getAFFromApertura==='function')?(getAFFromApertura()||[]):[];
  var afNeto=r2(afList.reduce(function(s,a){return r2(s+pn(a.vNeto));},0));
  var aNC=c.aNC||0;
  var difSS=r2(ssTSD-ssTSH);
  var difFL=r2(c.sF-c.cajaMN);
  var difPT=r2(patFinal-c.tPT);
  var difAF=r2(afNeto-aNC);
  var estados=[
    {n:'Balance General', ok:Math.abs(difBG)<1, dif:Math.abs(difBG), desc:'Activo = Pasivo + Patrimonio + Resultado'},

    {n:'Sumas y Saldos', ok:Math.abs(difSS)<1, dif:Math.abs(difSS), desc:'Total saldos Deudores = Total saldos Acreedores'},
    {n:'Evolución del Patrimonio', ok:Math.abs(difPT)<1, dif:Math.abs(difPT), desc:'Patrimonio final = Patrimonio del Balance'},

  var cuadran=estados.filter(function(x){return x.ok;}).length;

  function stRow(s){

    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'+
      '<div class="h2" style="flex:1;margin:0"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:5px"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01"/></svg>Cuadre de los Estados Financieros</div>'+
      '<div style="background:'+efColor+';color:var(--nm-sobre-fuerte,#FFFFFF);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px">'+cuadran+'/6 cuadran</div>'+
    '</div>'+
    estados.map(stRow).join('')+
    (cuadran===6
      ?'<div style="margin-top:12px;padding:10px;background:var(--nm-ok-bg,#DAF1DE);border-radius:6px;font-size:11px;color:var(--nm-ok,#235347);font-weight:600"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.12em"><path d="M20 6L9 17l-5-5"/></svg> Todos los estados financieros cuadran. Listos para exportar.</div>'

function exportExcelSS(){
  const c=calcAll();const cfg=emp().cfg;
  const nit=cfg.nit||'NIT';const year=cfg.gestion||'2025';
  // Formato EXACTO exigido por Impuestos Nacionales (SIAT)
  var aoa=[];
  aoa.push(['BALANCE DE COMPROBACIÓN DE SUMAS Y SALDOS']);
  aoa.push(['(EXPRESADO EN BOLIVIANOS)']);
  aoa.push([]);
  aoa.push(['CODIFICACIÓN DE LA CUENTA','','','','','NOMBRE DE LA CUENTA','SUMAS','','SALDOS','']);
  aoa.push(['CLASE','GRUPO','SUBGRUPO','CUENTA PRINCIPAL','CUENTA ANALÍTICA','','DEBE','HABER','DEUDOR','ACREEDOR']);
  c.ssA.forEach(function(k){
    var m=c.M[k];var s=String(k);
    var sd=r2(m.sD||0),sh=r2(m.sH||0);
    aoa.push([
      Number(s.charAt(0))||0, Number(s.charAt(1))||0, Number(s.charAt(2))||0,
      s.slice(3,6), s.slice(6,9), acctName(k),
      r2(m.debe||0), r2(m.haber||0),
      sd, sh
    ]);
  });
  var lastData=5+c.ssA.length;      // fila Excel del último dato (datos empiezan en fila 6)
  var totalRow=lastData+1;
  aoa.push(['TOTALES']);            // las fórmulas se colocan luego
  aoa.push([]);
  aoa.push(['NOTA: CONSIDERE QUE LAS CUENTAS Y SU RESPECTIVA CODIFICACIÓN AL CUARTO NIVEL DEBEN REALIZARSE CONFORME EL PLAN ÚNICO DE CUENTAS TRIBUTARIO (PUCT).']);
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  // Totales con fórmulas SUM (como el archivo oficial)
  ['G','H','I','J'].forEach(function(col){ ws[col+totalRow]={t:'n',f:'SUM('+col+'6:'+col+lastData+')'}; });
  // Celdas combinadas iguales al oficial
  ws['!merges']=['A1:J1','A2:J2','A4:E4','F4:F5','G4:H4','I4:J4','A'+totalRow+':F'+totalRow].map(function(r){return XLSX.utils.decode_range(r);});
  ws['!cols']=[{wch:7},{wch:7},{wch:9},{wch:16},{wch:16},{wch:36},{wch:12},{wch:12},{wch:12},{wch:12}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Hoja1');
  XLSX.writeFile(wb,'SIAT-BSS-'+nit+'-'+year+'-12.xlsx');
}

  if(c.vDF!==0)L.push({label:'Variación Débito Fiscal IVA',v:c.vDF});

  if(c.otrosOp!==0)L.push({label:'(±) Otras variaciones (neto)',v:c.otrosOp});
  L.push({t:'tot',label:'TOTAL OPERACIÓN',v:c.fOp});
  L.push({t:'grp',label:'ACTIVIDADES DE INVERSIÓN'});
  L.push({label:'Compras de activos fijos (no registradas en la gestión)',v:c.inv});

  L.push({t:'grp',label:'ACTIVIDADES DE FINANCIAMIENTO'});

  return L;
}

function fechaLarga(iso){var M=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];var p=String(iso||'').split('-');if(p.length!==3)return String(iso||'');return ('0'+parseInt(p[2],10)).slice(-2)+' DE '+(M[parseInt(p[1],10)-1]||'')+' DE '+p[0];}
function aptSub(k){var p3=k.slice(0,3);if(p3==='111')return 'Disponibles';if(p3==='112')return 'Inversiones Temporales';if(p3==='113')return 'Cuentas por Cobrar';if(p3==='114')return 'Bienes de Cambio';if(k.slice(0,2)==='11')return 'Créditos Fiscales';if(k.slice(0,2)==='12')return 'Bienes de Uso';return 'Otros Activos';}
function aperturaBalanceData(){
  var E=genEntries();var ape=E.find(function(x){return x.id==='APE';});var lines=(ape&&ape.lines)||[];
  var net={};lines.forEach(function(l){if(!l.c)return;net[l.c]=r2((net[l.c]||0)+(l.d||0)-(l.h||0));});
  var AC={},ANC={},PAS={},PAT=[];var tAC=0,tANC=0,tPAS=0,tPAT=0;
  Object.keys(net).sort().forEach(function(k){var v=net[k];if(r2(v)===0)return;var t=acctTipo(k);
    if(t==='A'){var val=r2(v);var sub=aptSub(k);if(k.slice(0,2)==='12'){(ANC[sub]=ANC[sub]||[]).push({c:k,v:val});tANC=r2(tANC+val);}else{(AC[sub]=AC[sub]||[]).push({c:k,v:val});tAC=r2(tAC+val);}}
    else if(t==='P'){var pv=r2(-v);(PAS['Pasivo Corriente']=PAS['Pasivo Corriente']||[]).push({c:k,v:pv});tPAS=r2(tPAS+pv);}
    else if(t==='PT'){var ptv=r2(-v);PAT.push({c:k,v:ptv});tPAT=r2(tPAT+ptv);}
  });
  return {AC:AC,ANC:ANC,PAS:PAS,PAT:PAT,tAC:tAC,tANC:tANC,tPAS:tPAS,tPAT:tPAT,tA:r2(tAC+tANC)};
}

function exportBackup(){
  try{
    var dump={_meta:{version:VERSION,fecha:new Date().toISOString(),app:'CONTAX'}, data:{}};
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      dump.data[k]=localStorage.getItem(k);
    }
    var blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    var stamp=new Date().toISOString().slice(0,10);
    a.href=url;a.download='CONTAX_respaldo_'+VERSION+'_'+stamp+'.json';
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
    if(typeof showNotif==='function')showNotif('✅ Respaldo completo descargado');
  }catch(e){alert('Error al crear el respaldo: '+e.message);}
}

function importBackupFile(input){
  var file=input.files&&input.files[0];if(!file)return;
  if(!confirm('⚠️ Restaurar un respaldo REEMPLAZA todos los datos actuales de este navegador por los del archivo. ¿Continuar?')){input.value='';return;}
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var dump=JSON.parse(ev.target.result);
      if(!dump||!dump.data)throw new Error('El archivo no es un respaldo válido de CONTAX.');
      Object.keys(dump.data).forEach(function(k){localStorage.setItem(k,dump.data[k]);});
      alert('✅ Respaldo restaurado (versión del respaldo: '+((dump._meta&&dump._meta.version)||'?')+'). La página se recargará.');
      location.reload();
    }catch(e){alert('No se pudo restaurar: '+e.message);}
  };
  reader.readAsText(file);
}

function renderHistorial(){
  var logs=[];
  try{logs=JSON.parse(localStorage.getItem('ca')||'[]');}catch(e){}
  
  var empFilter=S.histEmpFilter||'all';
  var typeFilter=S.histTypeFilter||'all';
  var search=(S.histSearch||'').toLowerCase();
  
  var filtered=logs.filter(function(l){
    if(empFilter!=='all'&&l.e!==empFilter)return false;
    if(typeFilter!=='all'&&l.cat!==typeFilter)return false;
    if(search&&!(l.a||'').toLowerCase().includes(search)&&
       !(l.u||'').toLowerCase().includes(search)&&
       !(l.e||'').toLowerCase().includes(search))return false;
    return true;
  });
  
  function fmtDate(iso){
    if(!iso)return '—';
    try{
      var d=new Date(iso);
      return d.toLocaleDateString('es-BO')+' '+d.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'});
    }catch(e){return iso;}
  }
  
  function actionIcon(a){
    if(!a)return '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>';

    if(a.includes('ingreso')||a.includes('venta'))return '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.5 9.2A2.6 2.6 0 0012 8c-1.4 0-2.5.8-2.5 1.9s1 1.7 2.5 1.9 2.5.9 2.5 2-1.1 1.9-2.5 1.9a2.6 2.6 0 01-2.5-1.2"/></svg>';
    if(a.includes('pago')||a.includes('cobr'))return '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>';
    if(a.includes('config')||a.includes('empresa'))return '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg>';
    if(a.includes('apertura'))return '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><path d="M3 8a2 2 0 012-2h4l2 2h8a2 2 0 012 2v7a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M3 10h18"/></svg>';
    if(a.includes('asiento'))return '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>';
    if(a.includes('plan'))return '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><rect x="6" y="4" width="12" height="18" rx="1"/><path d="M9 4V2h6v2M9 10h6M9 14h6"/></svg>';
    if(a.includes('usuario'))return '👤';
    if(a.includes('export')||a.includes('pdf'))return '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4M9 12h6M9 16h6"/></svg>';
    return '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>';
  }

  var rows=filtered.slice(0,200).map(function(l,i){
    var bg=i%2===0?'#F4FAF5':'#fff';
    return '<tr style="background:'+bg+'">'+
      '<td style="padding:6px 8px;font-size:11px;color:var(--nm-suave,#557363);white-space:nowrap">'+fmtDate(l.t)+'</td>'+
      '<td style="padding:6px 8px;font-size:12px;text-align:center">'+actionIcon(l.a)+'</td>'+
      '<td style="padding:6px 8px;font-size:11px;font-weight:600;color:var(--nm-texto,#163832)">'+( l.u||'—')+'</td>'+
      '<td style="padding:6px 8px;font-size:11px">'+( l.a||'—')+'</td>'+
      '<td style="padding:6px 8px;font-size:11px;color:var(--nm-suave,#557363)">'+( l.e||'—')+'</td>'+
    '</tr>';
  }).join('');

  var clearBtn=logs.length>0?
    '<button onclick="if(confirm(\'¿Limpiar TODO el historial?\')){{localStorage.removeItem(\'ca\');S.histSearch=\'\';re();}}" style="background:var(--nm-error-bg,#FDECEA);border:1px solid var(--nm-error-borde,#F4B8B2);border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer;color:var(--nm-error,#B42318)">🗑 Limpiar historial</button>':'';

  return '<div class="card">'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">'+
      '<div class="h2" style="flex:1;margin:0"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:5px"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3M3 3v5h5"/><path d="M12 8v4l3 2"/></svg>Historial de Cambios</div>'+
      clearBtn+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">'+
      '<input type="text" placeholder="Buscar acción, usuario..." value="'+(S.histSearch||'')+'" '+
        'oninput="S.histSearch=this.value;re()" '+
        'style="flex:1;min-width:180px;padding:6px 10px;border:1px solid var(--nm-borde,#DAF1DE);border-radius:6px;font-size:12px;outline:none"/>'+
    '</div>'+
    (filtered.length<logs.length?
      '<div style="font-size:11px;color:var(--nm-suave,#557363);margin-bottom:8px">Mostrando '+filtered.length+' de '+logs.length+' registros</div>':
      '<div style="font-size:11px;color:var(--nm-suave,#557363);margin-bottom:8px">Total: '+logs.length+' registros</div>')+
    (logs.length===0?
      '<div style="text-align:center;padding:40px;color:var(--nm-suave,#557363)">'+
        '<div style="font-size:32px;margin-bottom:8px"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><rect x="6" y="4" width="12" height="18" rx="1"/><path d="M9 4V2h6v2M9 10h6M9 14h6"/></svg></div>'+
        '<div>No hay registros en el historial.</div>'+
        '<div style="font-size:11px;margin-top:4px">Los cambios se registran automáticamente.</div>'+
      '</div>':
      '<div class="tbl-wrap" style="max-height:520px">'+
      '<table style="width:100%;border-collapse:collapse">'+
      '<thead><tr style="background:var(--nm-fuerte,#163832);color:var(--nm-sobre-fuerte,#FFFFFF);font-size:10px">'+
        '<th style="padding:6px 8px;text-align:left;white-space:nowrap">Fecha y Hora</th>'+
        '<th style="padding:6px 8px;text-align:center"></th>'+
        '<th style="padding:6px 8px;text-align:left">Usuario</th>'+
        '<th style="padding:6px 8px;text-align:left">Acción</th>'+
        '<th style="padding:6px 8px;text-align:left">Empresa</th>'+
      '</tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
      '</table></div>')+
  '</div>';
}

// ─── Startup ────────────────────────────────────────────
(function(){
  var sv=localStorage.getItem('cx_darkmode');
  var sys=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  var dk=sv==='1'?true:sv==='0'?false:!!sys;
  S.darkMode=dk;document.body.classList.toggle('dark-mode',dk);
  // Mientras el usuario no haya elegido manualmente, seguir el modo del sistema en tiempo real.
  if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(ev){if(localStorage.getItem('cx_darkmode')==null){S.darkMode=ev.matches;document.body.classList.toggle('dark-mode',ev.matches);if(typeof re==='function')re();}});}catch(e){}}
})();
if(typeof initFirebase==='function')initFirebase();
re();
</script>
</body>
</html>
