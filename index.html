<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NUMMEROS · Sistema Contable</title>
<meta name="theme-color" content="#F4FAF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#051F20" media="(prefers-color-scheme: dark)">
<meta name="description" content="NUMMEROS by CONTAX — Sistemas a la medida de tu empresa.">
<link rel="icon" href="marca/iconos/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="marca/iconos/icono-app-principal.svg">
<link rel="apple-touch-icon" href="marca/iconos/icono-app-principal-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Akshar:wght@400;500;600;700&family=Questrial&display=swap" rel="stylesheet"><style>
/* ══════════════════════════════════════════════════════════
   MARCA NUMMEROS — hoja de estilos del sistema
   Seis verdes, Akshar (títulos y cifras) y Century Gothic / Questrial (texto).
   Modo claro por defecto; el modo oscuro se activa con body.dark-mode.
   (Esta hoja también se copia a los PDF, por eso el oscuro NO depende
   de la preferencia del dispositivo: los PDF siempre salen claros.)
   ══════════════════════════════════════════════════════════ */
@font-face{font-family:'Akshar';font-style:normal;font-weight:600;font-display:swap;src:url(marca/fuentes/Akshar-600.woff2) format('woff2')}
@font-face{font-family:'Akshar';font-style:normal;font-weight:700;font-display:swap;src:url(marca/fuentes/Akshar-700.woff2) format('woff2')}
@font-face{font-family:'Questrial';font-style:normal;font-weight:400;font-display:swap;src:url(marca/fuentes/Questrial-400.woff2) format('woff2')}
:root{
  --verde-950:#051F20;--verde-900:#0B2B26;--verde-800:#163832;--verde-700:#235347;--verde-300:#8EB69B;--verde-100:#DAF1DE;
  --nm-fondo:#F4FAF5;--nm-superficie:#FFFFFF;--nm-campo:#EEF7F0;--nm-borde:#DAF1DE;--nm-borde-control:#6F9A7D;
  --nm-texto:#163832;--nm-suave:#557363;--nm-acento:#235347;--nm-sobre-acento:#FFFFFF;
  --nm-boton:#235347;--nm-sobre-boton:#FFFFFF;--nm-fuerte:#163832;--nm-sobre-fuerte:#FFFFFF;
  --nm-menta:#DAF1DE;--nm-salvia:#8EB69B;--nm-total:#DAF1DE;--nm-fila:#F4FAF5;
  --nm-menu-fondo:#DAF1DE;--nm-menu-texto:#163832;--nm-menu-activo:#235347;--nm-sobre-menu-activo:#FFFFFF;
  --nm-ok:#235347;--nm-ok-bg:#DAF1DE;--nm-ok-borde:#8EB69B;
  --nm-error:#B42318;--nm-error-bg:#FDECEA;--nm-error-borde:#F4B8B2;--nm-peligro:#B42318;
  --nm-aviso:#93370D;--nm-aviso-bg:#FDF3E4;--nm-aviso-borde:#EBC79B;
  --nm-sombra:0 1px 2px rgba(5,31,32,.08);--nm-sombra-alta:0 12px 32px rgba(5,31,32,.16);
  --nm-display:'Akshar','Arial Narrow',sans-serif;--nm-cuerpo:'Century Gothic','Questrial','Avenir Next',sans-serif;
  --r-sm:6px;--r-md:10px;--r-lg:16px;
}
body.dark-mode{
  --nm-fondo:#051F20;--nm-superficie:#0B2B26;--nm-campo:#163832;--nm-borde:#235347;--nm-borde-control:#8EB69B;
  --nm-texto:#DAF1DE;--nm-suave:#8EB69B;--nm-acento:#8EB69B;--nm-sobre-acento:#051F20;
  --nm-boton:#8EB69B;--nm-sobre-boton:#051F20;--nm-fuerte:#235347;--nm-sobre-fuerte:#DAF1DE;
  --nm-menta:#163832;--nm-salvia:#8EB69B;--nm-total:#163832;--nm-fila:rgba(142,182,155,.06);
  --nm-menu-fondo:#0B2B26;--nm-menu-texto:#DAF1DE;--nm-menu-activo:#8EB69B;--nm-sobre-menu-activo:#051F20;
  --nm-ok:#8EB69B;--nm-ok-bg:#163832;--nm-ok-borde:#235347;
  --nm-error:#F97066;--nm-error-bg:rgba(249,112,102,.12);--nm-error-borde:rgba(249,112,102,.45);--nm-peligro:#B42318;
  --nm-aviso:#FDB022;--nm-aviso-bg:rgba(253,176,34,.10);--nm-aviso-borde:rgba(253,176,34,.40);
  --nm-sombra:none;--nm-sombra-alta:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--nm-fondo);font-family:var(--nm-cuerpo);color:var(--nm-texto);font-size:13px;line-height:1.45}
::selection{background:var(--verde-300);color:var(--verde-950)}
:focus-visible{outline:2px solid var(--nm-acento);outline-offset:2px}

/* ── Encabezado ─────────────────────────────────────────── */
.hdr{background:var(--nm-superficie);color:var(--nm-texto);padding:8px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--nm-borde);position:sticky;top:0;z-index:100;min-height:56px}
.hdr-brand{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0;padding:4px 6px;border-radius:var(--r-sm)}
.hdr-brand:hover{background:var(--nm-campo)}
.hdr-brand img{height:20px;width:auto;flex-shrink:0;display:block}
.hdr-emp{font-size:11px;line-height:1.3;color:var(--nm-suave);border-left:1px solid var(--nm-borde);padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.hdr-emp b{color:var(--nm-texto);font-weight:600}
.hdr-pill{background:var(--nm-campo);border:1px solid var(--nm-borde);color:var(--nm-texto);border-radius:999px;padding:3px 10px;font:600 12px var(--nm-display);letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.hdr-pill:hover{border-color:var(--nm-borde-control)}
.hdr-pill.on{background:var(--nm-boton);border-color:var(--nm-boton);color:var(--nm-sobre-boton)}
.hdr-sync{font-size:11px;color:var(--nm-suave);white-space:nowrap}
.hdr-user{font-size:12px;color:var(--nm-suave);white-space:nowrap}
.hdr-btn{background:var(--nm-superficie);border:1px solid var(--nm-borde);color:var(--nm-texto);border-radius:var(--r-md);padding:6px 12px;font:600 13px var(--nm-display);letter-spacing:.02em;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hdr-btn:hover{background:var(--nm-campo);border-color:var(--nm-borde-control)}
.hdr-btn.prim{background:var(--nm-boton);border-color:var(--nm-boton);color:var(--nm-sobre-boton)}
.hdr-btn.prim:hover{filter:brightness(1.08)}
.logo{background:var(--nm-acento);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;cursor:pointer}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ok{color:var(--nm-ok);font-weight:700}.err{color:var(--nm-error);font-weight:700}

/* ── Menú lateral (menta, como en el manual) ────────────── */
.layout{display:flex;height:calc(100vh - 56px)}
.nav{width:206px;background:var(--nm-menu-fondo);overflow-y:auto;overflow-x:hidden;flex-shrink:0;padding:8px 10px 16px;transition:width .28s cubic-bezier(.4,0,.2,1),padding .28s ease;scrollbar-width:thin;scrollbar-color:var(--nm-salvia) transparent}
.nav.collapsed{width:62px;overflow:visible;padding:8px 8px 16px}
.nav-toggle{background:none;border:none;color:var(--nm-texto);cursor:pointer;font-size:18px;padding:4px 6px;line-height:1;flex-shrink:0;border-radius:var(--r-sm)}
.nav-toggle:hover{background:var(--nm-campo)}
.ns{padding:10px 14px 3px;font-size:10px;font-weight:600;color:var(--nm-suave);text-transform:uppercase;letter-spacing:.1em;font-family:var(--nm-display)}
.ni{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--nm-menu-texto);border-radius:var(--r-md);display:flex;align-items:center;gap:8px}
.ni.a{background:var(--nm-menu-activo);color:var(--nm-sobre-menu-activo)}
.ni:hover:not(.a){background:rgba(35,83,71,.08)}
.nsumm{padding:8px 14px;font-size:10px;color:var(--nm-suave);border-top:1px solid var(--nm-borde);margin-top:6px}
.nsumm div{color:var(--nm-texto);margin-top:2px}
.nav-sec{font:600 11px var(--nm-display);color:var(--nm-suave);text-transform:uppercase;letter-spacing:.12em;padding:16px 10px 6px;display:block}
.nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:1px 0;color:var(--nm-menu-texto);text-decoration:none;font-size:13px;border-radius:var(--r-md);transition:background .15s,color .15s;cursor:pointer;position:relative}
.nav-link:hover{background:rgba(35,83,71,.09)}
body.dark-mode .nav-link:hover{background:rgba(142,182,155,.12)}
.nav-link.active{background:var(--nm-menu-activo);color:var(--nm-sobre-menu-activo)}
.nav-ic{display:inline-flex;align-items:center;justify-content:center;width:18px;flex-shrink:0;opacity:.85}
.nav-link.active .nav-ic{opacity:1}
.nav-lb{white-space:nowrap;transition:opacity .2s ease}
.nav.collapsed .nav-sec{display:none}
.nav.collapsed .nav-link{justify-content:center;padding:10px 0}
.nav.collapsed .nav-lb{position:absolute;left:100%;top:50%;transform:translateY(-50%) translateX(-4px);margin-left:10px;background:var(--verde-800);color:#fff;padding:6px 11px;border-radius:var(--r-sm);font-size:12px;opacity:0;pointer-events:none;box-shadow:var(--nm-sombra-alta);z-index:70;transition:opacity .18s ease,transform .18s ease}
.nav.collapsed .nav-link:hover .nav-lb{opacity:1;transform:translateY(-50%) translateX(2px)}

/* ── Contenido ──────────────────────────────────────────── */
.cnt{flex:1;padding:20px 24px;overflow-y:auto;background:var(--nm-fondo)}
.cnt-marca{display:flex;justify-content:flex-end;margin:-4px 0 8px}
.cnt-marca img{height:14px;width:auto;opacity:.55}
.card{background:var(--nm-superficie);border:1px solid var(--nm-borde);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;box-shadow:var(--nm-sombra);color:var(--nm-texto)}
.h2{font-family:var(--nm-display);font-size:22px;line-height:1.15;font-weight:700;color:var(--nm-texto);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--nm-borde);letter-spacing:.01em}
.h3{font-family:var(--nm-display);font-size:13px;font-weight:600;color:var(--nm-texto);margin:14px 0 8px;background:var(--nm-menta);padding:5px 10px;border-radius:var(--r-sm);text-transform:uppercase;letter-spacing:.06em}
label{font-size:11px;font-weight:600;color:var(--nm-suave);display:block;margin-bottom:3px}
input,select,textarea{background:var(--nm-campo);border:1px solid var(--nm-borde-control);border-radius:var(--r-sm);padding:6px 9px;font-size:12px;width:100%;outline:none;font-family:inherit;color:var(--nm-texto)}
input::placeholder,textarea::placeholder{color:var(--nm-suave);opacity:.8}
input:focus,select:focus,textarea:focus{border-color:var(--nm-acento);box-shadow:0 0 0 3px rgba(35,83,71,.14)}
body.dark-mode input:focus,body.dark-mode select:focus,body.dark-mode textarea:focus{box-shadow:0 0 0 3px rgba(142,182,155,.22)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--nm-acento)}
.ro{background:var(--nm-fondo)!important;border-color:var(--nm-borde)!important;color:var(--nm-suave);pointer-events:none}
textarea{height:150px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

/* ── Botones ────────────────────────────────────────────── */
.btn,.btn-green,.btn-orange,.btn-purple{background:var(--nm-boton);color:var(--nm-sobre-boton);border:none;border-radius:var(--r-md);padding:8px 14px;font:600 13px var(--nm-display);letter-spacing:.02em;cursor:pointer}
.btn-blue{background:var(--nm-superficie);color:var(--nm-texto);border:1px solid var(--nm-borde-control);border-radius:var(--r-sm);padding:5px 11px;font:600 12px var(--nm-display);cursor:pointer}
.btn-orange,.btn-purple{background:var(--nm-superficie);color:var(--nm-texto);border:1px solid var(--nm-borde-control)}
.btn-del{background:var(--nm-peligro);color:#fff;border:none;border-radius:var(--r-sm);padding:4px 8px;font-size:11px;cursor:pointer}
.btn:hover,.btn-green:hover{filter:brightness(1.1)}
.btn-blue:hover,.btn-orange:hover,.btn-purple:hover{background:var(--nm-campo)}
button{font-family:inherit}
.sep{height:1px;background:var(--nm-borde);margin:14px 0}

/* ── Avisos ─────────────────────────────────────────────── */
.info{padding:10px 12px;border-radius:var(--r-md);font-size:12px;margin-top:8px}
.ig{background:var(--nm-ok-bg);border:1px solid var(--nm-ok-borde);color:var(--nm-texto)}
.ir{background:var(--nm-error-bg);border:1px solid var(--nm-error-borde);color:var(--nm-error)}
.ib{background:var(--nm-campo);border:1px solid var(--nm-borde);color:var(--nm-texto)}
.iy{background:var(--nm-aviso-bg);border:1px solid var(--nm-aviso-borde);color:var(--nm-aviso)}

/* ── Pestañas ───────────────────────────────────────────── */
.tab-bar{display:flex;gap:4px;margin-bottom:16px;background:var(--nm-campo);padding:4px;border-radius:var(--r-md);flex-wrap:wrap;border:1px solid var(--nm-borde)}
.tab-btn{padding:6px 13px;border-radius:var(--r-sm);font:600 13px var(--nm-display);letter-spacing:.02em;cursor:pointer;border:none;background:transparent;color:var(--nm-suave)}
.tab-btn:hover{color:var(--nm-texto)}
.tab-btn.a{background:var(--nm-superficie);color:var(--nm-texto);box-shadow:0 1px 2px rgba(5,31,32,.12)}
body.dark-mode .tab-btn.a{background:var(--verde-700);color:#fff}

/* ── Tablas: montos a la derecha con números tabulares ──── */
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{background:var(--nm-fuerte);color:var(--nm-sobre-fuerte);padding:7px 9px;font:600 11px var(--nm-display);letter-spacing:.06em;text-transform:uppercase;text-align:left;white-space:nowrap}
table.rcv-table thead th{position:sticky;top:0;z-index:3}
th.r{text-align:right}
td{padding:6px 9px;border-bottom:1px solid var(--nm-borde)}
td.r{font-family:var(--nm-display);font-weight:600;letter-spacing:.01em;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}
tbody tr:hover>td{background:rgba(142,182,155,.10)}
.tr-g{background:var(--nm-campo);font-weight:600;color:var(--nm-texto)}
.tr-t{background:var(--nm-total);font-weight:700}
.tr-f{background:var(--nm-fuerte);color:var(--nm-sobre-fuerte);font-weight:700}
.tr-f td{border:none;color:var(--nm-sobre-fuerte)}
.tr-i{background:var(--nm-ok-bg)}.tr-i td{color:var(--nm-ok);font-weight:700}
.tr-e{background:var(--nm-error-bg)}.tr-e td{color:var(--nm-error);font-weight:700}
.bok{background:var(--nm-ok-bg)}.ber{background:var(--nm-error-bg)}
.cok{color:var(--nm-ok);font-weight:700}.cer{color:var(--nm-error);font-weight:700}
.badge-ok,.badge-err,.badge-warn{padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-ok{background:var(--nm-ok-bg);color:var(--nm-ok);border:1px solid var(--nm-ok-borde)}
.badge-err{background:var(--nm-error-bg);color:var(--nm-error);border:1px solid var(--nm-error-borde)}
.badge-warn{background:var(--nm-aviso-bg);color:var(--nm-aviso);border:1px solid var(--nm-aviso-borde)}
.ee-hdr{text-align:center;margin-bottom:14px}
.ee-title{font:700 16px var(--nm-display);letter-spacing:.04em;color:var(--nm-texto)}
.ee-sub{font-size:11px;color:var(--nm-suave);margin-top:2px}
.tbl-wrap{max-height:460px;overflow-y:auto;border-radius:var(--r-md)}
.nota{font-size:11px;color:var(--nm-suave);margin:4px 0 8px}
.asiento{background:var(--nm-fondo);border:1px solid var(--nm-borde);border-radius:var(--r-md);padding:12px;margin-bottom:10px}
.asiento-hdr{font-weight:700;font-size:12px;color:var(--nm-texto);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}

/* ── Ventanas (empresas, cambios, exportar) ─────────────── */
.emp-modal{position:fixed;inset:0;background:rgba(5,31,32,.45);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center}
.emp-box{background:var(--nm-superficie);color:var(--nm-texto);border:1px solid var(--nm-borde);border-radius:var(--r-lg);padding:22px;width:500px;max-height:80vh;overflow-y:auto;box-shadow:var(--nm-sombra-alta)}
.emp-item{padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--nm-borde);margin-bottom:6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.emp-item:hover{background:var(--nm-campo);border-color:var(--nm-borde-control)}
.emp-item.ea{background:var(--nm-menta);border-color:var(--nm-acento);font-weight:700}
input.n{text-align:right;font-variant-numeric:tabular-nums}
input.g{background:var(--nm-menta)!important;border:1px solid var(--nm-salvia)!important;text-align:right;font-variant-numeric:tabular-nums}
input.g:focus{border-color:var(--nm-acento)!important;box-shadow:0 0 0 3px rgba(35,83,71,.14)!important}
.auto-card{background:var(--nm-fondo);border:1px solid var(--nm-borde);border-radius:var(--r-md);padding:10px;margin-bottom:8px}
.auto-card-hdr{font-size:11px;font-weight:700;color:var(--nm-texto);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.auto-row{display:grid;grid-template-columns:100px 1fr 120px 120px;gap:6px;margin-bottom:3px;align-items:center;font-size:11px}
.prog-bar{background:var(--nm-borde);border-radius:999px;height:8px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:999px;transition:width .3s}

/* ── Tarjetas oscuras de gráficos (pieza oscura de la marca) ── */
.dark-card{background:var(--verde-950);border-radius:var(--r-lg);padding:18px;color:var(--verde-100);margin-bottom:14px}
.dark-chart-title{font:600 12px var(--nm-display);color:var(--verde-300);margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi-circle{display:flex;flex-direction:column;align-items:center;justify-content:center;width:90px;height:90px;border-radius:50%;border:3px solid;position:relative}
.kpi-value{font:700 22px var(--nm-display)}
.kpi-label{font-size:9px;opacity:.75;margin-top:2px;text-align:center}

/* ── Inicio de sesión (legado) ──────────────────────────── */
.login-overlay{position:fixed;inset:0;background:var(--nm-fondo);z-index:1000;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--nm-superficie);border:1px solid var(--nm-borde);border-radius:var(--r-lg);padding:32px;width:480px;max-height:85vh;overflow-y:auto}
.user-avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;border:3px solid transparent;transition:all .2s;margin:0 auto 8px}
.user-avatar.sel{border-color:var(--nm-acento)}
.user-card{text-align:center;padding:12px 8px;cursor:pointer;border-radius:var(--r-md);transition:all .2s;border:1px solid transparent}
.user-card:hover{background:var(--nm-campo);border-color:var(--nm-borde)}
.user-card.sel{background:var(--nm-menta);border-color:var(--nm-acento)}
.new-user-form{background:var(--nm-campo);border-radius:var(--r-md);padding:16px;margin-top:12px}

/* ── NUMMEROS IA (pieza oscura: verde noche) ────────────── */
.chat-fab{position:fixed;bottom:24px;right:24px;width:54px;height:54px;background:var(--verde-700);border:none;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:500;box-shadow:0 8px 24px rgba(5,31,32,.28);font-size:22px;color:#fff;transition:transform .2s}
.chat-fab:hover{transform:translateY(-2px)}
.chat-fab svg{margin:0!important}
.chat-float{position:fixed;bottom:88px;right:24px;width:370px;height:500px;background:var(--verde-950);border-radius:var(--r-lg);z-index:500;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(5,31,32,.45);border:1px solid var(--verde-700);overflow:hidden;color:var(--verde-100)}
.chat-float-hdr{background:var(--verde-900);border-bottom:1px solid var(--verde-800);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;color:var(--verde-100);font:700 15px var(--nm-display);letter-spacing:.03em}
.chat-float-body{flex:1;overflow-y:auto;padding:12px;background:var(--verde-950)}
.chat-float-inp{display:flex;gap:6px;padding:10px;background:var(--verde-900);border-top:1px solid var(--verde-800)}

// Verifica contra la nube si el correo está autorizado.
function checkAuthorized(user,cb){
  var email=normEmail(user.email);
  function decide(list){
    if(!list||!list.length)return cb(true,'bootstrap');
    var f=list.find(function(u){return normEmail(u.email)===email;});
    if(f&&f.habilitado!==false)return cb(true,f);
    return cb(false);
  }
  if(fbDb){
    fbDb.collection('contax_config').doc('global').get().then(function(snap){
      var list=[];
      if(snap.exists){try{var g=JSON.parse(snap.data().data||'{}');if(g.authusers){try{list=JSON.parse(g.authusers);}catch(e){}}}catch(e){}}
      if(list&&list.length){try{localStorage.setItem('cx_authusers',JSON.stringify(list));}catch(e){}}
      decide(list);
    }).catch(function(){decide(getAuthUsers());});
  }else decide(getAuthUsers());
}

      try{if((JSON.parse(localStorage.getItem('cx_authusers')||'[]')).length)fbPushAcceso();}catch(e){}

        var _cl=[],_ll=[];try{_cl=JSON.parse(d.authusers)||[];}catch(e){}try{_ll=JSON.parse(localStorage.getItem('cx_authusers')||'[]')||[];}catch(e){}
        if(_cl.length===0&&_ll.length>0){fbPushAcceso();} // nube vacía + local con usuarios → NO borrar; subir local
        else{syncApplying=true;localStorage.setItem('cx_authusers',d.authusers);syncApplying=false;changed=true;}
      }
      if(d.perms!=null&&d.perms!==localStorage.getItem('cx_perms')){syncApplying=true;localStorage.setItem('cx_perms',d.perms);syncApplying=false;changed=true;}
      if(changed)re();

    if(!k||k.indexOf('cx_')!==0)continue;
    if(k.length>=suf.length&&(k.slice(-suf.length)===suf||k.indexOf(suf+'_')>-1))out.push(k);
  }

}

  var de=(S.empDir||[]).find(function(x){return x.id===id;});
  var cur=le&&le.cfg?!!le.cfg.terminado:(de?!!de.terminado:false);

  if(fbDb){var p={emps:{}};p.emps[id]={terminado:nv};fbDb.collection('contax_config').doc('empresas').set(p,{merge:true}).catch(function(){});}

// Abrir una empresa: si no está local, se descarga de la nube
function openEmpresa(id){
  if((S.empresas||[]).find(function(e){return e.id===id;})){S.activeId=id;S.showEmp=false;saveLS();re();return;}
  if(fbDb){
    showNotif('⬇️ Cargando empresa desde la nube…');
    fbDb.collection('contax').doc(id).get().then(function(snap){
      if(snap.exists){
        try{var incoming=JSON.parse((snap.data()||{}).data||'{}');
          if(incoming&&incoming.emp){syncApplying=true;applyEmpSnapshot(id,incoming);syncApplying=false;}
        }catch(e){syncApplying=false;}
      }
      if(!(S.empresas||[]).find(function(e){return e.id===id;})){alert('Esta empresa aún no tiene datos en la nube.');re();return;}
      S.activeId=id;S.showEmp=false;saveLS();re();

      if(k==='cx_session'||k==='cu'||k==='ca'||k==='cx_darkmode'||k==='ai_reporte'||k==='cx_access'||k==='cx_override_code'||k.indexOf('ia_msgs')===0)return;

      if(k==='contax_v2'){scheduleSync();scheduleSyncGlobal();return;}
      if(k.indexOf('cx_')===0&&S.activeId&&k.indexOf('_'+S.activeId)>-1){scheduleSync();}
    }catch(e){}
  };
  localStorage.__cxPatched=true;
})();

function fbLogin(email,pass){
  if(!fbAuth)return alert('Firebase no disponible');
  fbAuth.signInWithEmailAndPassword(email,pass).catch(function(e){
    var m=e.code==='auth/user-not-found'?'Usuario no encontrado':
          e.code==='auth/wrong-password'?'Contraseña incorrecta':e.message;
    alert('Firebase: '+m);
  });
}

function fbRegister(email,pass){
  if(!fbAuth)return alert('Firebase no disponible');
  var name=prompt('Tu nombre completo:');
  if(!name)return;
  fbAuth.createUserWithEmailAndPassword(email,pass).then(function(c){
    c.user.updateProfile({displayName:name});
    alert('✓ Cuenta creada: '+email);
  }).catch(function(e){alert('Error: '+e.message);});
}

function fbLogout(){if(fbAuth)fbAuth.signOut();}

function showNotif(msg){
  try{
    var n=document.getElementById('fb-notif');
    if(!n){n=document.createElement('div');n.id='fb-notif';
      n.style.cssText='position:fixed;top:55px;right:12px;background:var(--nm-fuerte,#163832);color:var(--nm-sobre-fuerte,#FFFFFF);padding:8px 14px;border-radius:8px;font-size:11px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:opacity .3s';
      document.body.appendChild(n);}
    n.textContent=msg;n.style.opacity='1';
    setTimeout(function(){n.style.opacity='0';},3000);
  }catch(e){}
}

function parseRCV(txt){

      total:pn(c[7]),ice:pn(c[8]),iehd:pn(c[9]),ipj:pn(c[10]),tasas:pn(c[11]),

      derechoCF:c[22]?.trim(),estado:c[23]?.trim(),cat:c[24]?.trim()};
  }).filter(r=>r.nro&&!isNaN(parseFloat(r.nro)));
}
// Clave de mes (YYYY-MM) a partir de una fecha DD/MM/YYYY o YYYY-MM-DD, para agrupar el RCV por mes.
function rcvMonthKey(f){
  var s=String(f||'').trim();if(!s)return '0000-00';
  if(s.indexOf('/')>=0){var p=s.split('/');if(p.length===3)return p[2]+'-'+('0'+p[1]).slice(-2);}
  if(s.indexOf('-')>=0){var q=s.split('-');if(q.length===3)return q[0]+'-'+('0'+q[1]).slice(-2);}
  return '0000-00';
}

  var p=String(mk||'').split('-');var m=parseInt(p[1],10)||0;return (MN[m]||mk)+' '+(p[0]||'');
}
// Número entero a letras en español (0 – 999.999.999)
function enteroALetras(n){
  n=Math.floor(n);if(n===0)return 'CERO';
  var U=['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISEIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIUNO','VEINTIDOS','VEINTITRES','VEINTICUATRO','VEINTICINCO','VEINTISEIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
  var D=['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  var C=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  function dos(x){if(x<30)return U[x];var d=Math.floor(x/10),u=x%10;return D[d]+(u?' Y '+U[u]:'');}
  function tres(x){if(x===100)return 'CIEN';var c=Math.floor(x/100),r=x%100;return (c?C[c]:'')+(c&&r?' ':'')+(r?dos(r):'');}
  var millones=Math.floor(n/1000000),miles=Math.floor((n%1000000)/1000),resto=n%1000,out='';
  if(millones)out+=(millones===1?'UN MILLON':enteroALetras(millones)+' MILLONES');
  if(miles)out+=(out?' ':'')+(miles===1?'MIL':tres(miles).replace(/UNO$/,'UN')+' MIL');
  if(resto)out+=(out?' ':'')+tres(resto);
  return out.trim();
}
// "SON: ... 08/100 BOLIVIANOS"
function numeroALiteral(num){
  var v=r2(Math.abs(pn(num)));
  var ent=Math.floor(v+1e-6);var dec=Math.round(r2(v-ent)*100);
  if(dec>=100){dec-=100;ent+=1;}
  var pal=enteroALetras(ent).replace(/UNO$/,'UN');
  var dS=(dec<10?'0'+dec:''+dec);
  return 'SON: '+pal+' '+dS+'/100 BOLIVIANOS';
}

function buildM(entries){
  const M={};
  const add=(c,d,h)=>{if(!c)return;if(!M[c])M[c]={debe:0,haber:0};M[c].debe=r2(M[c].debe+r2(d||0));M[c].haber=r2(M[c].haber+r2(h||0));};
  entries.forEach(e=>(e.lines||[]).forEach(l=>add(l.c,l.d,l.h)));
  Object.keys(M).forEach(k=>{
    const{debe,haber}=M[k],t=acctTipo(k);
    M[k].saldo=(t==='A'||t==='G')?r2(debe-haber):r2(haber-debe); // I,P,PT = haber-debe
    M[k].sD=r2(Math.max(0,debe-haber));M[k].sH=r2(Math.max(0,haber-debe));
  });
  return M;
}

      var groups={};
      valid.forEach(function(r){var mk=rcvMonthKey(r.fecha);(groups[mk]=groups[mk]||[]).push(r);});
      Object.keys(groups).sort().forEach(function(mk){var lines=rcvLinesFor(groups[mk]);if(lines.length)E.push({id:'RCVE_'+mk,tipo:'E',desc:'COMPROBANTE EGRESOS — RCV COMPRAS '+rcvMonthLabel(mk),glosa:'Registro de compras del mes de '+rcvMonthLabel(mk),lines:lines});});
    } else {
      var lines=rcvLinesFor(valid);if(lines.length)E.push({id:'RCVE',tipo:'E',desc:'COMPROBANTE DE EGRESOS — RCV COMPRAS',glosa:'Registro de compras de la gestión '+_gest,lines:lines});
    }
  }

  // INGRESOS XLSX (ventas cargadas)
  const ventasXLSX=e.ventasData||[];
  if(ventasXLSX.length>0){
    const vov=e.ventasOverrides||{};
    const vpays=getVentasPayments();
    // Construye las líneas (balanceadas) de un conjunto de ventas.
    function ventasLinesFor(list){
      const conV={};
      list.forEach(function(v){
        var i=ventasXLSX.indexOf(v);
        var cuenta=(vov&&vov[i])||v.cuenta||'411002004';
        var tot=r2(v.total);var ingNeto=r2(tot*0.87);var dfIva=r2(tot*0.13);var it=r2(tot*0.03);
        var _vp=(vpays[i])||'efectivo';var _cd=_vp==='porcobrar'?'113001001':_vp==='banco'?'111002001':'111001001';
        if(!conV[_cd])conV[_cd]={d:0,h:0};conV[_cd].d=r2(conV[_cd].d+tot);
        if(!conV[cuenta])conV[cuenta]={d:0,h:0};conV[cuenta].h=r2(conV[cuenta].h+ingNeto);
        if(!conV['214001001'])conV['214001001']={d:0,h:0};conV['214001001'].h=r2(conV['214001001'].h+dfIva);
        if(!conV['525002001'])conV['525002001']={d:0,h:0};conV['525002001'].d=r2(conV['525002001'].d+it);
        if(!conV['214004001'])conV['214004001']={d:0,h:0};conV['214004001'].h=r2(conV['214004001'].h+it);
      });
      var tdV=r2(Object.values(conV).reduce((s,v)=>r2(s+v.d),0));
      var thV=r2(Object.values(conV).reduce((s,v)=>r2(s+v.h),0));
      var diffV=r2(tdV-thV);
      if(Math.abs(diffV)>0.001){if(diffV>0){if(!conV['441004001'])conV['441004001']={d:0,h:0};conV['441004001'].h=r2((conV['441004001'].h||0)+diffV);}else{if(!conV['561004001'])conV['561004001']={d:0,h:0};conV['561004001'].d=r2((conV['561004001'].d||0)-diffV);}}
      return Object.entries(conV).map(([c,v])=>({c,d:v.d,h:v.h}));
    }
    var ventasMode=(e.cfg&&e.cfg.ventasMode)||'anual';
    var venCmt=(typeof getVentasComments==='function')?getVentasComments():{};
    var _gestV=(e.cfg&&e.cfg.gestion)||'';
    if(ventasMode==='factura'){
      ventasXLSX.forEach(function(v){var i=ventasXLSX.indexOf(v);var lines=ventasLinesFor([v]);if(!lines.length)return;
        var gl=String(venCmt[i]||'').trim()||('Venta a '+String(v.razon||'cliente')+(v.fecha?(' del '+v.fecha):''));
        E.push({id:'VXLS'+i,tipo:'I',desc:'COMPROBANTE INGRESO — '+String(v.razon||'Venta').slice(0,40)+(v.fecha?(' | '+v.fecha):''),glosa:gl,lines:lines});});
    } else if(ventasMode==='mensual'){
      var vg={};ventasXLSX.forEach(function(v){var mk=rcvMonthKey(v.fecha);(vg[mk]=vg[mk]||[]).push(v);});
      Object.keys(vg).sort().forEach(function(mk){var lines=ventasLinesFor(vg[mk]);if(lines.length)E.push({id:'VXLS_'+mk,tipo:'I',desc:'COMPROBANTE INGRESOS — VENTAS '+rcvMonthLabel(mk),glosa:'Registro de ventas del mes de '+rcvMonthLabel(mk),lines:lines});});
    } else {
      var lines=ventasLinesFor(ventasXLSX);if(lines.length)E.push({id:'VXLS',tipo:'I',desc:'COMPROBANTE DE INGRESOS — VENTAS (XLSX)',glosa:'Registro de ventas de la gestión '+_gestV,lines:lines});
    }
  }

  // INGRESOS MANUALES — 87% ingreso, 13% DF, 3% IT sobre total
  (e.ingresos||[]).forEach((ing,i)=>{
    const tot=r2(pn(ing.monto));if(!tot)return;
    const ingNeto=r2(tot*0.87);
    const dfIva=r2(tot*0.13);
    const it=r2(tot*0.03);
    const diff=r2(tot-ingNeto-dfIva);
    const lines=[{c:'111001001',d:tot,h:0},{c:ing.cuenta||'411002004',d:0,h:ingNeto},{c:'214001001',d:0,h:dfIva},{c:'525002001',d:it,h:0},{c:'214004001',d:0,h:it}];
    if(Math.abs(diff)>0.001)lines.push(diff>0?{c:'441004001',d:0,h:diff}:{c:'561004001',d:-diff,h:0});
    E.push({id:'ING'+i,tipo:'I',desc:'INGRESO '+(MESES[(ing.mes||1)-1]||'').toUpperCase(),lines});
  });

  // ACTIVOS — UFV + DEPRECIACIÓN (desde Apertura + RCV con UFV por fecha)
  // Los activos de apertura usan UFVini/UFVfin del período completo
  // Los activos del RCV usan la UFV del día de compra y deprecian proporcionalmente
  const afItems=getAFFromApertura();
  afItems.forEach((af,i)=>{
    if(Math.abs(af.ajA)>0)
      E.push({id:'UA'+i,tipo:'T',desc:'UFV ACTIVO: '+af.nombre,
        lines:[{c:af.cA,d:af.ajA,h:0},{c:'441001001',d:0,h:af.ajA}]});
    if(Math.abs(af.ajD)>0)
      E.push({id:'UD'+i,tipo:'T',desc:'UFV DEP.ACUM: '+af.nombre,
        lines:[{c:'561001001',d:af.ajD,h:0},{c:af.cD,d:0,h:af.ajD}]});
    if(af.dep>0)
      E.push({id:'D'+i,tipo:'T',desc:'DEPRECIACIÓN'+(af.meses&&af.meses<12?' ('+af.meses+'/12 meses)':'')+(': '+af.nombre),
        lines:[{c:af.cG,d:af.dep,h:0},{c:af.cD,d:0,h:af.dep}]});
  });
  // También procesar activos manuales (pestaña AF, si hay)
  (e.activos||[]).forEach((af,i)=>{
    const tab=afTipoFor(af.tipo);if(!tab)return;
    const anios=pn(tab.anios)||1;
    const vH=r2(pn(af.valorHistorico)),dAP=r2(pn(af.depAcumAnterior));
    const ajA=ui>0?r2(vH*(uR-1)):0;
    const ajD=ui>0?r2(dAP*(uR-1)):0;
    if(Math.abs(ajA)>0)E.push({id:'UAM'+i,tipo:'T',desc:'UFV ACTIVO (M): '+(af.nombre||af.tipo),lines:[{c:tab.cA,d:ajA,h:0},{c:'441001001',d:0,h:ajA}]});
    if(Math.abs(ajD)>0)E.push({id:'UDM'+i,tipo:'T',desc:'UFV DEP.ACUM (M): '+(af.nombre||af.tipo),lines:[{c:'561001001',d:ajD,h:0},{c:tab.cD,d:0,h:ajD}]});
    const dep=r2(r2(vH+ajA)/anios);
    if(dep>0)E.push({id:'DM'+i,tipo:'T',desc:'DEPRECIACIÓN (M): '+(af.nombre||af.tipo),lines:[{c:tab.cG,d:dep,h:0},{c:tab.cD,d:0,h:dep}]});
  });

  // V63 — Cancelación automática de Cuentas por Cobrar / Pagar según estado y forma de pago
  (typeof getCxC==='function'?(getCxC()||[]):[]).forEach(function(x,i){
    if(x&&x.estado==='cobrado'){
      var m=r2(pn(x.monto));if(!m)return;
      var caja=(x.formaPago==='transferencia'||x.formaPago==='banco')?'111002001':'111001001';
      E.push({id:'COB'+i,tipo:'T',desc:'Cobro CxC: '+(x.razon||''),lines:[{c:caja,d:m,h:0},{c:(x.cuenta||'113001001'),d:0,h:m}]});
    }
  });
  (typeof getCxP==='function'?(getCxP()||[]):[]).forEach(function(x,i){
    if(x&&x.estado==='pagado'){
      var m=r2(pn(x.monto));if(!m)return;
      var caja=(x.formaPago==='transferencia'||x.formaPago==='banco')?'111002001':'111001001';
      E.push({id:'PAG'+i,tipo:'T',desc:'Pago CxP: '+(x.proveedor||x.razon||''),lines:[{c:(x.cuenta||'212004001'),d:m,h:0},{c:caja,d:0,h:m}]});
    }
  });

  // UFV CAPITAL
  const capT=r2(pn(tr.capitalSocial)+pn(tr.ajusteCapital));
  const ajC=ui>0?r2(capT*(uR-1)):0;
  if(Math.abs(ajC)>0)E.push({id:'UFVC',tipo:'T',desc:'AJUSTE CAPITAL UFV',lines:[{c:'561001001',d:ajC,h:0},{c:'311002001',d:0,h:ajC}]});
  // V70 — Actualización de Resultados Acumulados (solo si es positivo): Debe AITB 561001001 / Haber Resultados Acumulados 313001001
  const resAcumG=r2(pn(tr.resAcum));
  const ajResAcumG=(ui>0&&resAcumG>0)?r2(resAcumG*(uR-1)):0;
  if(Math.abs(ajResAcumG)>0)E.push({id:'UFVRA',tipo:'T',desc:'AJUSTE RESULTADOS ACUMULADOS UFV',lines:[{c:'561001001',d:ajResAcumG,h:0},{c:'313001001',d:0,h:ajResAcumG}]});

  // IUE — basado en Gastos No Deducibles (hoja ER, E67-E72)
  const mT=buildM(E);
  const tI2=r2(Object.entries(mT).filter(([k])=>acctTipo(k)==='I').reduce((s,[,v])=>r2(s+v.saldo),0));
  const tG2=r2(Object.entries(mT).filter(([k])=>acctTipo(k)==='G').reduce((s,[,v])=>r2(s+v.saldo),0));
  const util2=r2(tI2-tG2); // E67: Resultado de la Gestión
  const gasNoDed2=r2(pn(e.cfg.gasNoDed||0)); // E68: Gastos No Deducibles
  const perdNComp2=r2(pn(e.cfg.perdNComp||0)); // E69: Saldo de Pérdida No Compensada
  const resTrib2=r2(util2+gasNoDed2-perdNComp2); // E70: Resultado Tributario
  // IUE se calcula al final con todos los asientos incluidos (ver más abajo)

  // COMPENSACIONES — MANUALES: se generan desde la pestaña Compensaciones (valores que ingresa el usuario por mes)
  // Debe: actualización CF (116001001), DF (214001001), IT (214004001), Multas (214026001)
  // Haber: ingreso ajuste UFV (441001001), CF usado (116001001), IUE a compensar (116006001), Caja (111001001)
  (typeof getCompData==='function'?(getCompData()||[]):[]).forEach(function(m,idx){
    var lines=[];
    var ajCF=r2(pn(m.ajCF)),ajUFV=r2(pn(m.ajUFV));
    var cDF=r2(pn(m.compDF)),cCF=r2(pn(m.compCF)),cIT=r2(pn(m.compIT));
    var cIUE=r2(pn(m.compIUE)),cMul=r2(pn(m.compMultas)),cCaja=r2(pn(m.compCaja));
    if(ajCF>0)lines.push({c:'116001001',d:ajCF,h:0});
    if(cDF>0)lines.push({c:'214001001',d:cDF,h:0});
    if(cIT>0)lines.push({c:'214004001',d:cIT,h:0});
    if(cMul>0)lines.push({c:'525019002',d:cMul,h:0}); // V87: gasto (Mant. de Valor e Intereses), ya no debita el pasivo 214026001 (evita negativo en el Balance)
    if(ajUFV>0)lines.push({c:'441001001',d:0,h:ajUFV});
    if(cCF>0)lines.push({c:'116001001',d:0,h:cCF});
    if(cIUE>0)lines.push({c:'116006001',d:0,h:cIUE});
    if(cCaja>0)lines.push({c:'111001001',d:0,h:cCaja});
    if(lines.length>0)E.push({id:'COMPM'+idx,tipo:'T',desc:'COMPENSACIÓN '+((MESES[idx]||('MES '+(idx+1)))+'').toUpperCase(),lines:lines});
  });

  // ── ASIENTO IUE AUTOMÁTICO (25% Resultado Tributario) ──
  // Calcular utilidad con el estado actual de E
  const mIUE=buildM(E);
  const tI_IUE=r2(Object.entries(mIUE).filter(([k])=>acctTipo(k)==='I').reduce((s,[,v])=>r2(s+v.saldo),0));
  const tG_IUE=r2(Object.entries(mIUE).filter(([k])=>acctTipo(k)==='G').reduce((s,[,v])=>r2(s+v.saldo),0));
  const util_IUE=r2(tI_IUE-tG_IUE);
  const gasNoDed_IUE=r2(pn(e.cfg.gasNoDed||0));
  const perdNComp_IUE=r2(pn(e.cfg.perdNComp||0));
  const resTrib_IUE=r2(util_IUE+gasNoDed_IUE-perdNComp_IUE);
  const iue_IUE=resTrib_IUE>0?r2(resTrib_IUE*0.25):0;
  if(iue_IUE>0){
    E.push({
      id:'IUE',
      tipo:'T',
      desc:'PROVISIÓN IUE — 25% del Resultado Tributario ('+fmt(resTrib_IUE)+' Bs.)',
      lines:[
        {c:'116006001',d:iue_IUE,h:0},  // DEBE: IUE A Compensar (Activo)
        {c:'214006001',d:0,h:iue_IUE}   // HABER: IUE Por Pagar (Pasivo)
      ]
    });
  }

  return E;
}

function calcAll(){
  const E=genEntries();const M=buildM(E);const gs=k=>r2(M[k]?.saldo||0);
  const tI=r2(Object.entries(M).filter(([k])=>acctTipo(k)==='I').reduce((s,[,v])=>r2(s+v.saldo),0));
  const tG=r2(Object.entries(M).filter(([k])=>acctTipo(k)==='G').reduce((s,[,v])=>r2(s+v.saldo),0));
  const util=r2(tI-tG);
  const aC=r2(Object.keys(M).filter(function(k){return acctTipo(k)==='A'&&!k.startsWith('12');}).reduce(function(s,k){return r2(s+gs(k));},0));
  const aNC=r2(Object.keys(M).filter(k=>acctTipo(k)==='A'&&k.startsWith('12')).reduce((s,k)=>r2(s+gs(k)),0));
  const tA=r2(aC+aNC);
  const tP=r2(Object.keys(M).filter(k=>acctTipo(k)==='P').reduce((s,k)=>r2(s+gs(k)),0));
  const tPT=r2(Object.keys(M).filter(k=>acctTipo(k)==='PT').reduce((s,k)=>r2(s+gs(k)),0)+util);
  const difBG=r2(tA-tP-tPT);
  const dep=r2(Object.keys(M).filter(k=>k.startsWith('524')).reduce((s,k)=>r2(s+gs(k)),0));
  const e=emp();const ui=pn(e.cfg.ufvInicio),uf=pn(e.cfg.ufvFin);const uR=ui>0?(uf/ui):1;
  const capT=r2(pn(e.traspaso.capitalSocial)+pn(e.traspaso.ajusteCapital));
  const ajC=ui>0?r2(capT*(uR-1)):0;
  const gUFV=gs('561001001'),iUFV=gs('441001001');
  const vCF=r2(gs('116001001')-pn(e.traspaso.cfIva));
  const vIC=r2(gs('116006001')-pn(e.traspaso.iueComp));
  const vDF=r2(gs('214001001')-pn(e.traspaso.dfIva));
  const vIT=r2(gs('214004001')-pn(e.traspaso.itPagar));
  const vIUE=r2(gs('214006001')-pn(e.traspaso.iuePagar));
  const vPr=r2(gs('212003001')-pn(e.traspaso.prestamos));
  const vCxC=r2(gs('113001001')-pn(e.traspaso.cxc||0)); // variación cuentas por cobrar
  const vCxP=r2(gs('212004001')-pn(e.traspaso.cxp||0)); // variación cuentas por pagar
  const vMultas=r2(gs('214026001')-pn(e.traspaso.multas)); // variación multas por pagar
  // ── FLUJO DE EFECTIVO — a prueba de balas: se ancla al efectivo real del Balance ──
  // Efectivo = Caja + Banco. El cambio de efectivo es un hecho (cierre − apertura), así que el flujo SIEMPRE cuadra.
  const sI=r2(pn(e.traspaso.caja)+pn(e.traspaso.banco));            // efectivo inicial (apertura)
  const cajaMN=r2(gs('111001001')+gs('111002001'));                 // efectivo final (Balance)
  const difF=r2(cajaMN-sI);                                         // variación real de efectivo (exacta)
  // Operación (método indirecto) y Financiamiento (préstamos). Inversión = el resto (residual),
  // que corresponde a las compras de activos fijos pagadas en efectivo/banco.
  const fOpNamed=r2(util+dep+gUFV-iUFV-vCF-vIC+vDF+vIT+vIUE-vCxC+vCxP+vMultas);
  const fFin=r2(vPr);
  // ── Otras variaciones de operación (a prueba de fugas) ─────────────────────
  // El sistema no modela compras de activos fijos DURANTE la gestión (todos vienen del asiento de apertura),
  // por lo que el residual histórico NO es inversión: es la variación de cuentas de balance que la lista fija
  // de arriba no captura (impuestos en otras subcuentas, redondeos que no netean contra caja/CF, etc.).
  // Se clasifica en OPERACIÓN para que el flujo operativo refleje el 100%. La inversión queda en 0.
  const otrosOp=r2(difF-fOpNamed-fFin);
  const fOp=r2(fOpNamed+otrosOp);                                   // operación = 100% (todo lo no financiero)
  const inv=0;                                                      // sin compras de A.F. modeladas en la gestión
  const sF=r2(sI+difF);                                             // = efectivo final → siempre cuadra
  // ── Diagnóstico: qué cuentas componen "otras variaciones" (movimientos del período, sin apertura) ──
  const _Emov=E.filter(function(x){return x.id!=='APE';});
  const _Mmov=buildM(_Emov);
  const _gsMov=function(k){return r2((_Mmov[k]&&_Mmov[k].saldo)||0);};
  const _contrib=function(k){var t=acctTipo(k);return (t==='A'||t==='G')?-_gsMov(k):_gsMov(k);};
  const _named={'111001001':1,'111002001':1,'113001001':1,'116001001':1,'116006001':1,'212003001':1,'212004001':1,'214001001':1,'214004001':1,'214006001':1,'214026001':1};
  const _proxy={'561001001':1,'441001001':1};                       // no monetarias (UFV) y sus contrapartes
  _Emov.forEach(function(en){var cs=(en.lines||[]).map(function(l){return l.c;});if(cs.indexOf('561001001')>=0||cs.indexOf('441001001')>=0){cs.forEach(function(cc){_proxy[cc]=1;});}});
  const flowLeak=[];
  Object.keys(_Mmov).forEach(function(k){
    var t=acctTipo(k);if(t==='I'||t==='G')return;                   // P&L → ya está en Utilidad
    if(k.charAt(0)==='1'&&k.charAt(1)==='2')return;                 // activos fijos → proxy dep/UFV
    if(k.indexOf('524')===0)return;                                 // depreciación acumulada → proxy 'dep'
    if(_named[k]||_proxy[k])return;
    var v=_contrib(k);if(Math.abs(v)>=0.005)flowLeak.push({k:k,name:acctName(k),v:v});
  });
  flowLeak.sort(function(a,b){return Math.abs(b.v)-Math.abs(a.v);});
  const ssA=Object.keys(M).filter(k=>M[k].debe>0||M[k].haber>0).sort();
  const ssTD=r2(ssA.reduce((s,k)=>r2(s+r2(M[k].debe)),0));
  const ssTH=r2(ssA.reduce((s,k)=>r2(s+r2(M[k].haber)),0));
  const ssTSD=r2(ssA.reduce((s,k)=>r2(s+r2(M[k].sD||0)),0));
  const ssTSH=r2(ssA.reduce((s,k)=>r2(s+r2(M[k].sH||0)),0));
  return{E,M,gs,util,tI,tG,aC,aNC,tA,tP,tPT,difBG,dep,gUFV,iUFV,vCF,vIC,vDF,vIT,vIUE,vPr,inv,fOp,fOpNamed,otrosOp,flowLeak,fFin,difF,sI,sF,cajaMN,ajC,vCxC,vCxP,vMultas,ssA,ssTD,ssTH,ssTSD,ssTSH,bgOK:difBG===0,ssOK:r2(ssTSD-ssTSH)===0,fOK:r2(sF-cajaMN)===0};
}

// EXPORT
function exportXL(){
  const c=calcAll();const{M,gs,util,tI,tG,aC,aNC,tA,tP,tPT,ssA,ssTD,ssTH,ssTSD,ssTSH,dep,gUFV,iUFV,vCF,vIC,vDF,vIT,vIUE,vPr,inv,fOp,fFin,difF,sI,sF,cajaMN}=c;
  const cfg=emp().cfg;const wb=XLSX.utils.book_new();
  const add=(nm,data)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),nm);
  // BG
  add('Balance General',[['BALANCE GENERAL'],['Empresa: '+cfg.razonSocial,'NIT: '+cfg.nit],['Al '+cfg.fechaFin],[],

function iaVisionCreds(){

  if(vk)return {key:vk,prov:vp,dedicated:true};

function extractConfigFromImage(input){
  var f=input&&input.files&&input.files[0];if(!f)return;
  if(f.type.indexOf('image/')!==0){alert('Selecciona una imagen.');input.value='';return;}
  if(f.size>5*1024*1024){alert('La imagen es muy grande (máx 5 MB).');input.value='';return;}
  var _cr=iaVisionCreds();var key=_cr.key,prov=_cr.prov;
  if(!key){alert('Configura una API key con visión (Gemini, Claude o ChatGPT) en la pestaña "NUMMEROS IA".');input.value='';return;}
  if(prov==='deepseek'){alert('DeepSeek no admite imágenes. Configura una API key de Visión (Gemini recomendado) en "NUMMEROS IA".');input.value='';return;}
  var rd=new FileReader();
  rd.onload=function(){
    var url=rd.result;var m=/^data:([^;]+);base64,(.*)$/.exec(url);var mime=m?m[1]:'image/png',b64=m?m[2]:'';
    window._cfgExtracting=true;re();
    var prompt='Analiza esta captura del padrón del SIAT de Bolivia (Información del Contribuyente). Devuelve SOLO un JSON válido, sin texto adicional ni comillas de código, con esta forma exacta: {"razonSocial":"","nit":"","repLegal":"","repLegalCI":"","actividades":[{"codigo":"","nombre":"","estado":""}]}. Reglas: razonSocial = valor del campo "Razón Social". nit = valor del campo "NIT". repLegal = "Nombre Completo" del primer Representante Legal. repLegalCI = su "Número Documento". actividades = TODAS las actividades económicas listadas (primaria y secundaria), cada una con codigo, nombre y estado (por ejemplo "VIGENTE"). Si algún dato no aparece, deja cadena vacía.';
    iaVision(prompt,mime,b64,url,key,prov).then(function(txt){
      var jm=txt&&txt.match(/\{[\s\S]*\}/);if(!jm)throw new Error('La IA no devolvió datos reconocibles');
      var d=JSON.parse(jm[0]);var cfg=emp().cfg;var filled=[];
      if(d.razonSocial){cfg.razonSocial=String(d.razonSocial).trim();filled.push('Razón Social');}
      if(d.nit){cfg.nit=String(d.nit).replace(/\s/g,'').trim();filled.push('NIT');}
      if(d.repLegal){cfg.repLegal=String(d.repLegal).trim();filled.push('Representante Legal');}
      if(d.repLegalCI){cfg.ci=String(d.repLegalCI).replace(/\s/g,'').trim();filled.push('C.I.');}
      var acts=(d.actividades||[]).filter(function(a){return a&&/vigente/i.test(a.estado||'');});
      if(acts.length){cfg.actividad=acts.map(function(a){return (a.nombre||'').trim();}).filter(Boolean).join('; ');filled.push('Actividad ('+acts.length+' vigente'+(acts.length>1?'s':'')+')');}
      saveLS();window._cfgExtracting=false;re();
      alert(filled.length?('✓ Datos extraídos: '+filled.join(', ')+'.\nRevísalos y edita lo que necesites.'):'La IA no encontró datos en la imagen. Intenta con una captura más clara.');
    }).catch(function(e){window._cfgExtracting=false;re();alert('No se pudieron extraer los datos: '+(e&&e.message||e));});
  };
  rd.readAsDataURL(f);input.value='';
}
async function iaVision(prompt,mime,b64,url,key,prov){
  if(prov==='claude'){
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:900,messages:[{role:'user',content:[{type:'text',text:prompt},{type:'image',source:{type:'base64',media_type:mime,data:b64}}]}]})});
    var d=await r.json();return (d.content&&d.content[0]&&d.content[0].text)||(d.error&&('Error: '+d.error.message))||'';
  } else if(prov==='openai'){
    var r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url:url}}]}]})});
    var d=await r.json();return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||(d.error&&('Error: '+d.error.message))||'';
  } else {
    var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt},{inlineData:{mimeType:mime,data:b64}}]}]})});
    var d=await r.json();return (d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts&&d.candidates[0].content.parts[0]&&d.candidates[0].content.parts[0].text)||(d.error&&('Error: '+d.error.message))||'';
  }
}

function pasteUFV(txt){
  if(!txt.trim()){alert('Pega datos primero');return;}
  const rows=txt.trim().split('\n').map(r=>r.split('\t'));
  const data=[];
  rows.forEach(r=>{
    const fR=r[0]?.trim(),ufv=r[1]?.trim();if(!fR||!ufv)return;
    let fecha=fR;
    if(fR.includes('/')){const p=fR.split('/');if(p.length===3)fecha=(p[2].length===4?p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0'):fR);}
    data.push({fecha,ufv});
  });
  S.ufvData=data;saveLS();re();alert('✓ '+data.length+' UFVs cargadas');
}
function doUFVSearch(){
  const d=document.getElementById('ufv-search')?.value;if(!d)return;
  const found=S.ufvData.find(u=>u.fecha===d);
  const el=document.getElementById('ufv-result');
  if(el)el.innerHTML=found?'<span class="badge-ok">UFV '+d+': <strong>'+found.ufv+'</strong></span>':'<span class="badge-err">No encontrado para '+d+'</span>';
}

function pasteNITs(txt){
  if(!txt.trim()){alert('Pega datos primero');return;}
  const rows=txt.trim().split('\n');
  let added=0,skipped=0;
  rows.forEach(row=>{
    const cols=row.split('\t');
    if(cols.length<2){skipped++;return;}
    const nit=(cols[0]||'').trim();
    const razon=(cols[1]||'').trim();
    const cat=(cols[2]||'').trim();
    const cuenta=(cols[3]||'').trim();
    if(!nit){skipped++;return;}
    // Check if NIT already exists
    const exists=S.nits.findIndex(n=>String(n.nit)===String(nit));
    if(exists>=0){
      // Update existing
      S.nits[exists]={nit,razon,cat,cuenta};
    } else {
      S.nits.push({nit,razon,cat,cuenta});
      added++;
    }
  });
  saveLS();re();
  alert('✓ '+added+' NITs nuevos importados. '+(rows.length-added-skipped)+' actualizados. '+skipped+' omitidos.');
}

      }

      alert('Plan importado: '+newPlan.length+' cuentas.');

function allSelectableAccts(){
  var hidden=getPlanHidden();var out=[];var seen={};
  PLAN_DEFAULT.forEach(function(r){
    if(r.l!=='CUENTA ANALITICA')return;
    if(hidden.indexOf(r.a)>=0)return;
    seen[r.a]=1;out.push({c:r.a,n:acctName(r.a)});
  });
  (S.planCuentas||[]).forEach(function(x){
    var code=''+(x.a||x.c||'');if(code.length!==9)return;
    if(hidden.indexOf(code)>=0||seen[code])return;
    seen[code]=1;out.push({c:code,n:x.n||x.g||acctName(code)});
  });
  return out;
}

const ACCESS_CODE = 'CONTAX2025'; // ← Cambia este código
const ADMIN_CODE  = 'ADMIN_CONTAX'; // ← Código de administrador

function checkAccess(){
  // Check if current user is active
  const cu=getCurrentUser&&getCurrentUser();
  if(cu){
    const users=getUsers();
    const found=users.find(function(u){return u.username===cu.username;});
    if(found&&found.active===false){
      // Show blocked screen
      document.getElementById('root').innerHTML='<div class="nm-pantalla"><div class="nm-patron" aria-hidden="true"></div>'+
        '<img src="'+nmLogo()+'" alt="NUMMEROS" style="height:80px;width:auto;margin-bottom:6px"/>'+

        '<div style="font-size:14px;color:var(--nm-suave);max-width:360px">El administrador desactivó tu usuario. Escríbele a CONTAX para que te ayuden a recuperarlo.</div>'+
        '<button onclick="logout()" class="nm-login-btn" style="width:auto;padding:11px 26px;margin-top:6px">Cerrar sesión</button>'+
        '</div>';
      return null; // special null means "blocked, don't proceed"
    }
    if(found) return true; // active user, skip code check
  }
  // Check access code
  const overrideCode=localStorage.getItem('cx_override_code');
  const effectiveCode=overrideCode||ACCESS_CODE;
  const stored = localStorage.getItem('cx_access');
  if(!stored) return false;
  try { const d = JSON.parse(stored); return d.code === effectiveCode || d.code === ADMIN_CODE; }
  catch { return false; }
}

function grantAccess(code){
  if(code !== ACCESS_CODE && code !== ADMIN_CODE) return false;
  localStorage.setItem('cx_access', JSON.stringify({code, ts: new Date().toISOString()}));
  // Log active user
  const user = getUser ? getUser() : 'desconocido';
  const activos = JSON.parse(localStorage.getItem('cx_activos')||'[]');
  activos.unshift({user, ts: new Date().toISOString(), code: code===ADMIN_CODE?'ADMIN':'USER'});
  if(activos.length > 50) activos.length = 50;
  localStorage.setItem('cx_activos', JSON.stringify(activos));
  return true;
}

function calcAutoOA(){
  const tr=emp().traspaso;
  const ui=pn(emp().cfg.ufvInicio),uf=pn(emp().cfg.ufvFin);
  const uR=ui>0?(uf/ui):1;
  // AJUSTE DE CAPITAL
  const capSoc=r2(pn(tr.capitalSocial));
  const ajCap2=r2(pn(tr.ajusteCapital));
  const ajCapSoc=ui>0?r2(capSoc*(uR-1)):0;
  const ajCapAj=ui>0?r2(ajCap2*(uR-1)):0;
  const totalAjCap=r2(ajCapSoc+ajCapAj);
  // AJUSTE RESULTADOS ACUMULADOS (solo si positivo)
  const resAcumV=r2(pn(tr.resAcum));
  const ajResAcum=(ui>0&&resAcumV>0)?r2(resAcumV*(uR-1)):0;
  // PER ASSET
  const assetCalcs=[];
  (emp().activos||[]).forEach(af=>{
    const tab=TAF[af.tipo];if(!tab)return;
    const vH=r2(pn(af.valorHistorico));
    const dAP=r2(pn(af.depAcumAnterior));
    const ajA=ui>0?r2(vH*(uR-1)):0;
    const vAct=r2(vH+ajA);
    const dep=r2(vAct*tab.tasa);
    const ajD=ui>0?r2(dAP*(uR-1)):0;
    assetCalcs.push({af,tab,ajA,dep,ajD});
  });
  return{totalAjCap,ajCapSoc,ajCapAj,ajResAcum,assetCalcs,uR,ui,uf};
}

function buildAFSection(){
  const afItems=getAFFromApertura();
  if(!afItems.length)return '';
  const ufvTotal=r2(afItems.reduce(function(s,a){return r2(s+a.ajA);},0));
  const depTotal=r2(afItems.reduce(function(s,a){return r2(s+a.dep);},0));
  const ufvDTotal=r2(afItems.reduce(function(s,a){return r2(s+a.ajD);},0));
  const parts=['<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:var(--nm-texto,#163832);margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--nm-borde,#DAF1DE)"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><rect x="5" y="7" width="14" height="12" rx="2"/><path d="M12 3v4M9 12h.01M15 12h.01M9.5 16h5M3 11v3M21 11v3"/></svg> ASIENTOS AUTOMÁTICOS — ACTIVOS FIJOS</div>'];
  if(ufvTotal>0){
    const ufvLines=[];
    afItems.filter(function(a){return a.ajA>0;}).forEach(function(a){ufvLines.push({c:a.cA,d:a.ajA,h:0});});
    if(ufvLines.length){ufvLines.push({c:'441001001',d:0,h:ufvTotal});}
    parts.push(roAsientoAF('Actualización Activos Fijos con UFV',ufvLines));
  }
  if(depTotal>0){
    const depLines=[];
    afItems.filter(function(a){return a.dep>0;}).forEach(function(a){
      depLines.push({c:a.cG,d:a.dep,h:0});depLines.push({c:a.cD,d:0,h:a.dep});
    });
    parts.push(roAsientoAF('Depreciación Activos Fijos',depLines));
  }
  if(ufvDTotal>0){
    const ufvDLines=[];
    afItems.filter(function(a){return a.ajD>0;}).forEach(function(a){
      ufvDLines.push({c:'561001001',d:a.ajD,h:0});ufvDLines.push({c:a.cD,d:0,h:a.ajD});
    });
    parts.push(roAsientoAF('Actualización Depreciación Acumulada con UFV',ufvDLines));
  }
  parts.push('<div class="nota">Estos asientos se incluyen automáticamente en Comprobantes y Mayores.</div></div>');
  return parts.join('');
}


function calcTraspasoResultados(){
  const tr=emp().traspaso;
  const ua=r2(pn(tr.utilidadAnterior||0));
  if(ua>0)return{tipo:'utilidad',monto:ua};
  if(ua<0)return{tipo:'perdida',monto:Math.abs(ua)};
  return null;
}

function renderCuadroAF(){
  const ui=pn(emp().cfg.ufvInicio),uf=pn(emp().cfg.ufvFin);const uR=ui>0?(uf/ui):1;
  const cfg=emp().cfg;
  // Get items from Apertura + RCV (auto) and from Activos tab (manual)
  const autoItems=getAFFromApertura();
  const manualItems=(emp().activos||[]).map(af=>{
    const tab=afTipoFor(af.tipo);if(!tab)return null;
    const anios=pn(tab.anios)||1;
    const vH=r2(pn(af.valorHistorico)),dAP=r2(pn(af.depAcumAnterior));
    const ajA=ui>0?r2(vH*(uR-1)):0,vAct=r2(vH+ajA),dep=r2(vAct/anios),ajD=ui>0?r2(dAP*(uR-1)):0;
    const jVal=r2(dAP+ajD);
    return{tipo:af.tipo,nombre:af.nombre||af.tipo,fuente:'Manual',anios:anios,meses:12,ufvIni:ui,ufvFin:uf,coef:uR,baseNeto:vH,vH,dAP,ajA,vAct,dep,ajD,jVal,dTotal:r2(jVal+dep),vNeto:r2(vAct-r2(jVal+dep)),tasa:(pn(tab.pct)||0)/100,cA:tab.cA,cD:tab.cD,cG:tab.cG};
  }).filter(Boolean);

  // Merge: auto items first, then manual only if no duplicate type
  const autoTypes=new Set(autoItems.map(a=>a.cA));
  const allItems=[...autoItems,...manualItems.filter(m=>!autoTypes.has(m.cA))];

  function num(v){return v?fmt(r2(v)):'';}
  const rows=allItems.map(af=>'<tr>'+
    '<td>'+af.nombre+'</td>'+
    '<td style="font-size:10px;color:var(--nm-suave,#557363)">'+af.fuente+'</td>'+
    '<td style="font-size:10px;text-align:center">'+(af.fuente==='Apertura'?'Apertura':(af.fecha||'—'))+'</td>'+

      '<td class="r">'+fmt(totD)+'</td>'+
      '<td class="r">'+fmt(totF)+'</td>'+
      '<td class="r">'+fmt(totG)+'</td>'+

function renderEE(c){
  const{M,gs,util,tI,tG,aC,aNC,tA,tP,tPT,difBG,dep,gUFV,iUFV,vCF,vIC,vDF,vIT,vIUE,vPr,inv,fOp,fFin,difF,sI,sF,cajaMN,ajC,ssA,ssTD,ssTH,ssTSD,ssTSH,bgOK,ssOK,fOK}=c;
  const cfg=emp().cfg;const tr=emp().traspaso;let ee='';const st=S.sub;
  if(st==='bg'){
    function bgRow(k){return '<tr><td style="padding-left:18px"><span style="font-family:Akshar,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:10px;color:var(--nm-suave,#557363);margin-right:5px">'+k+'</span>'+acctName(k)+'</td><td class="r">'+fmt(gs(k))+'</td></tr>';}
    var acR=Object.keys(M).filter(function(k){return acctTipo(k)==='A'&&!k.startsWith('12')&&gs(k)!==0;}).sort().map(bgRow).join('');
    var ancR=Object.keys(M).filter(function(k){return acctTipo(k)==='A'&&k.startsWith('12')&&gs(k)!==0;}).sort().map(bgRow).join('');
    const pasR=Object.keys(M).filter(k=>acctTipo(k)==='P'&&gs(k)!==0).map(k=>'<tr><td style="padding-left:18px"><span style="font-family:Akshar,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:10px;color:var(--nm-suave,#557363);margin-right:5px">'+k+'</span>'+acctName(k)+'</td><td class="r">'+fmt(gs(k))+'</td></tr>').join('');
    const patR=Object.keys(M).filter(k=>acctTipo(k)==='PT'&&gs(k)!==0).map(k=>'<tr><td style="padding-left:18px"><span style="font-family:Akshar,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:10px;color:var(--nm-suave,#557363);margin-right:5px">'+k+'</span>'+acctName(k)+'</td><td class="r">'+fmt(gs(k))+'</td></tr>').join('');
    ee='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
      '<table><thead><tr><th colspan="2">ACTIVO</th></tr></thead><tbody>'+
      '<tr class="tr-g"><td colspan="2">ACTIVO CORRIENTE</td></tr>'+acR+'<tr class="tr-t"><td>TOTAL ACTIVO CORRIENTE</td><td class="r">'+fmt(aC)+'</td></tr>'+
      '<tr class="tr-g"><td colspan="2">ACTIVO NO CORRIENTE</td></tr>'+ancR+'<tr class="tr-t"><td>TOTAL ACTIVO NO CORRIENTE</td><td class="r">'+fmt(aNC)+'</td></tr>'+
      '</tbody><tfoot><tr class="tr-f"><td>TOTAL ACTIVO</td><td class="r">'+fmt(tA)+'</td></tr></tfoot></table>'+
      '<table><thead><tr><th colspan="2">PASIVO + PATRIMONIO</th></tr></thead><tbody>'+
      '<tr class="tr-g"><td colspan="2">PASIVO CORRIENTE</td></tr>'+pasR+'<tr class="tr-t"><td>TOTAL PASIVO</td><td class="r">'+fmt(tP)+'</td></tr>'+
      '<tr class="tr-g"><td colspan="2">PATRIMONIO</td></tr>'+patR+
      '<tr><td style="padding-left:18px">UTILIDAD DE LA GESTIÓN</td><td class="r">'+fmt(util)+'</td></tr>'+
      '<tr class="tr-t"><td>TOTAL PATRIMONIO</td><td class="r">'+fmt(tPT)+'</td></tr>'+
      '</tbody><tfoot>'+
      '<tr class="tr-f"><td>TOTAL PASIVO + PATRIMONIO</td><td class="r">'+fmt(r2(tP+tPT))+'</td></tr>'+
      '<tr class="'+(bgOK?'bok':'ber')+'"><td>DIFERENCIA</td><td class="r '+(bgOK?'cok':'cer')+'">'+fmt(difBG)+' '+(bgOK?'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.12em"><path d="M20 6L9 17l-5-5"/></svg>':'')+'</td></tr>'+
      '</tfoot></table></div>';
  } else if(st==='er'){
    const cfg2=emp().cfg;
    const gasNoDedER=r2(pn(cfg2.gasNoDed||0));
    const perdNCompER=r2(pn(cfg2.perdNComp||0));
    const resTribER=r2(util+gasNoDedER-perdNCompER);
    const iueER=resTribER>0?r2(resTribER*0.25):0;
    const utilDespues=r2(util-iueER);

    // ── Jerarquía desde PLAN_DEFAULT + cuentas analíticas personalizadas ──
    // V87 — incluir cuentas creadas por el usuario (S.planCuentas) que no están en PLAN_DEFAULT,
    // para que al asignar una cuenta en Ingresos/RCV se refleje como línea en el Estado de Resultados.
    var custAnal=(S.planCuentas||[]).filter(function(x){
      var code=x.a||x.c;
      return code&&(''+code).length===9&&!PLAN_DEFAULT.find(function(r){return r.a===code;});
    }).map(function(x){
      var code=x.a||x.c;
      return {a:code,g:x.n||x.g||code,l:'CUENTA ANALITICA',t:x.t||acctTipo(code),b:(''+code)[0]};
    });
    // V94 — insertar cada cuenta personalizada en su lugar por código (no al final),
    // para que aparezca bajo su Cuenta Principal/Sub Grupo correcto (ej. 526002xxx → OTROS GASTOS).
    function insSorted(base,extra){
      var arr=base.slice();
      extra.forEach(function(cr){
        var idx=arr.findIndex(function(r){return r.a>cr.a;});
        if(idx<0)arr.push(cr);else arr.splice(idx,0,cr);
      });
      return arr;
    }
    var planI=insSorted(PLAN_DEFAULT.filter(function(r){return r.t==='I';}),
      custAnal.filter(function(x){return x.t==='I'||acctTipo(x.a)==='I';}));
    var planG=insSorted(PLAN_DEFAULT.filter(function(r){return r.t==='G';}),
      custAnal.filter(function(x){return x.t==='G'||acctTipo(x.a)==='G';}));

    function sumChildren(prefixCode, tipo){
      return Object.keys(M).filter(function(k){
        return k.startsWith(prefixCode)&&acctTipo(k)===tipo&&gs(k)!==0;
      }).reduce(function(s,k){return r2(s+gs(k));},0);
    }

    function buildSection(planRows, tipo, headerColor, rowColor, totalLabel){
      var rows='';
      var sectionTotal=0;
      planRows.forEach(function(r){
        var isAnal=r.l==='CUENTA ANALITICA';
        var saldo=isAnal?(gs(r.a)||0):sumChildren(r.a,tipo);
        if(saldo===0)return;
        // Para ingresos mostramos positivo, para gastos positivo (son costos)
        var display=tipo==='I'?saldo:saldo;
        var indent=r.l==='CUENTA'?0:r.l==='GRUPO'?1:r.l==='SUB GRUPO'?2:r.l==='CUENTA PRINCIPAL'?3:4;
        var padLeft=(indent*14)+'px';

        if(r.l==='CUENTA'){
          rows+='<tr style="background:'+headerColor+';color:var(--nm-sobre-fuerte,#FFFFFF)">'+
            '<td style="padding:7px 10px;font-weight:900;font-size:13px">'+acctName(r.a)+'</td>'+

      '<span style="font-size:11px;color:var(--nm-suave,#557363)">Genera un solo PDF con los libros mayores (cada cuenta en su página). Usa <strong>Ver</strong> para uno solo.</span>'+

function renderGraficos(c){
  const{util,tI,tG,gs,M,tA,tP,tPT}=c;
  const cfg=emp().cfg;
  const PAL=['#235347','#8EB69B','#051F20','#DAF1DE','#163832','#0B2B26'];

  function miniBar(vals,color,title,labels){
    const max=Math.max(...vals)||1;const W=500,H=80;
    const bw=Math.max(8,Math.floor((W-20)/vals.length)-2);
    const bars=vals.map(function(v,i){
      const bh=Math.round(v/max*H);const x=10+i*(bw+2);
      return '<rect x="'+x+'" y="'+(H-bh)+'" width="'+bw+'" height="'+bh+'" fill="'+color+'" rx="2" opacity=".85"><title>'+(labels?labels[i]:i+1)+': '+fmt(v)+'</title></rect>'+
        (bh>0?'<text x="'+(x+bw/2)+'" y="'+(H-bh-3)+'" text-anchor="middle" font-size="8" fill="'+color+'">'+fmt(v)+'</text>':'')+
        '<text x="'+(x+bw/2)+'" y="'+(H+12)+'" text-anchor="middle" font-size="7.5" fill="#557363">'+(labels?labels[i].substring(0,4):i+1)+'</text>';
    }).join('');
    return '<div style="margin-bottom:10px">'+
      '<div style="font-size:11px;font-weight:700;color:var(--nm-texto,#163832);margin-bottom:6px">'+title+'</div>'+
      '<svg viewBox="0 0 '+(W+10)+' '+(H+18)+'" width="100%">'+bars+'</svg></div>';
  }

  function donut(items,title){
    const tot=items.reduce(function(s,x){return s+x.v;},0);if(!tot)return '';
    let st=0;const R=55,r=28,cx=70,cy=70;
    const slices=items.map(function(item,i){
      const a=item.v/tot*360;const s1=st*Math.PI/180;const e1=(st+a)*Math.PI/180;
      const x1=cx+R*Math.sin(s1);const y1=cy-R*Math.cos(s1);
      const x2=cx+R*Math.sin(e1);const y2=cy-R*Math.cos(e1);
      const x3=cx+r*Math.sin(e1);const y3=cy-r*Math.cos(e1);
      const x4=cx+r*Math.sin(s1);const y4=cy-r*Math.cos(s1);
      const lg=a>180?1:0;st+=a;
      return '<path d="M'+x1.toFixed(1)+','+y1.toFixed(1)+' A'+R+','+R+',0,'+lg+',1,'+x2.toFixed(1)+','+y2.toFixed(1)+
        ' L'+x3.toFixed(1)+','+y3.toFixed(1)+' A'+r+','+r+',0,'+lg+',0,'+x4.toFixed(1)+','+y4.toFixed(1)+' Z"'+
        ' fill="'+PAL[i%PAL.length]+'" stroke="#fff" stroke-width="2"><title>'+item.n+': '+fmt(item.v)+'</title></path>';
    }).join('');
    const legend=items.map(function(item,i){
      return '<div style="display:flex;align-items:center;gap:5px;font-size:11px;margin-bottom:3px">'+
        '<div style="width:10px;height:10px;background:'+PAL[i%PAL.length]+';border-radius:2px;flex-shrink:0"></div>'+
        '<span style="font-size:10px;line-height:1.3">'+item.n+'</span><span style="margin-left:auto;font-weight:700">'+fmt(item.v)+'</span></div>';
    }).join('');
    return '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
      '<div><div style="font-size:11px;font-weight:700;color:var(--nm-texto,#163832);margin-bottom:6px">'+title+'</div>'+
        '<svg viewBox="0 0 140 140" width="130" height="130">'+slices+
        '<text x="70" y="66" text-anchor="middle" font-size="10" fill="#557363">TOTAL</text>'+
        '<text x="70" y="79" text-anchor="middle" font-size="11" font-weight="700" fill="#163832">'+fmt(tot)+'</text>'+
        '</svg></div>'+
      '<div style="flex:1;min-width:120px">'+legend+'</div>'+
    '</div>';
  }

  function kpi(val,label,icon){
    return '<div style="background:var(--nm-fondo,#F4FAF5);border:1px solid var(--nm-borde,#DAF1DE);border-radius:8px;padding:12px;text-align:center">'+
      '<div style="font-size:18px;margin-bottom:4px">'+icon+'</div>'+
      '<div style="font-size:16px;font-weight:700;color:var(--nm-texto,#163832)">'+val+'</div>'+
      '<div style="font-size:10px;color:var(--nm-suave,#557363);margin-top:2px">'+label+'</div></div>';
  }

  const inc=Object.keys(M).filter(function(k){return acctTipo(k)==='I'&&gs(k)>0;}).map(function(k){return{n:acctName(k).substring(0,20),v:gs(k)};});
  const gto=Object.keys(M).filter(function(k){return acctTipo(k)==='G'&&gs(k)>0;}).sort(function(a,b){return gs(b)-gs(a);}).slice(0,8).map(function(k){return{n:acctName(k).substring(0,20),v:gs(k)};});
  const margen=tI>0?r2(util/tI*100):0;
  const MESES_G=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const tribData=buildTribResumen();

  return '<div class="card"><div class="h2"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:5px"><path d="M4 20V11M10 20V4M16 20v-7M4 20h16"/></svg>Gráficos — '+cfg.razonSocial+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">'+
      kpi(fmt(tI)+' Bs','Total Ingresos','<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.5 9.2A2.6 2.6 0 0012 8c-1.4 0-2.5.8-2.5 1.9s1 1.7 2.5 1.9 2.5.9 2.5 2-1.1 1.9-2.5 1.9a2.6 2.6 0 01-2.5-1.2"/></svg>')+
      kpi(fmt(tG)+' Bs','Total Gastos','<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><path d="M12 20v-9M8.5 14.5L12 11l3.5 3.5"/><path d="M4 9V6a2 2 0 012-2h12a2 2 0 012 2v3"/></svg>')+
      kpi(fmt(util)+' Bs',(util>=0?'Utilidad':'Pérdida'),(util>=0?'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><path d="M3 17l6-6 4 4 7-8"/><path d="M17 7h4v4"/></svg>':'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><path d="M3 7l6 6 4-4 7 8"/><path d="M17 17h4v-4"/></svg>'))+
      kpi(margen+'%','Margen de Utilidad','<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;margin-right:4px"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>')+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'+
      '<div class="card" style="box-shadow:none;border:1px solid var(--nm-borde,#DAF1DE)">'+donut([{n:'Ingresos',v:tI},{n:'Gastos',v:tG}],'Ingresos vs Gastos')+'</div>'+
      '<div class="card" style="box-shadow:none;border:1px solid var(--nm-borde,#DAF1DE)">'+donut([{n:'Activo',v:tA},{n:'Pasivo',v:tP},{n:'Patrimonio',v:tPT}],'Estructura del Balance')+'</div>'+
    '</div>'+
    (gto.length?'<div class="card" style="box-shadow:none;border:1px solid var(--nm-borde,#DAF1DE);margin-bottom:12px">'+miniBar(gto.map(function(x){return x.v;}),PAL[0],'Top Gastos del Período (Bs)',gto.map(function(x){return x.n;}))+'</div>':'')+
    (inc.length>1?'<div class="card" style="box-shadow:none;border:1px solid var(--nm-borde,#DAF1DE);margin-bottom:12px">'+donut(inc,'Desglose de Ingresos')+'</div>':'')+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
      '<div class="card" style="box-shadow:none;border:1px solid var(--nm-borde,#DAF1DE)">'+
        miniBar(tribData.map(function(m){return m.ivaAPagar;}),PAL[0],'IVA a Pagar por Mes (Bs)',MESES_G)+
        miniBar(tribData.map(function(m){return m.itAPagar;}),PAL[2],'IT a Pagar por Mes (Bs)',MESES_G)+
      '</div>'+
      '<div class="card" style="box-shadow:none;border:1px solid var(--nm-borde,#DAF1DE)">'+
        miniBar(tribData.map(function(m){return m.compras;}),PAL[1],'Total Compras por Mes (Bs)',MESES_G)+
        miniBar(tribData.map(function(m){return m.ventas;}),PAL[3],'Total Ventas por Mes (Bs)',MESES_G)+
      '</div>'+
    '</div>'+
  '</div>';
}

function addAuthUser(){
  if(!isCurrentAdmin())return alert('Solo el administrador puede agregar usuarios.');
  var em=normEmail((document.getElementById('au-email')||{}).value);
  var nm=((document.getElementById('au-nombre')||{}).value||'').trim();
  var rol=(document.getElementById('au-rol')||{}).value||'Contador';
  var pin=((document.getElementById('au-pin')||{}).value||'').trim();
  if(!em||em.indexOf('@')<0)return alert('Ingresa un correo válido.');
  if(pin.length<4)return alert('Ingresa un PIN de al menos 4 caracteres para este usuario.');
  var list=getAuthUsers();
  if(list.find(function(u){return normEmail(u.email)===em;}))return alert('Ese correo ya está en la lista.');
  list.push({email:em,nombre:nm||em,rol:rol,habilitado:true,pin:pin});
  saveAuthUsers(list);re();
}
function setAuthPin(i){
  if(!isCurrentAdmin())return;
  var list=getAuthUsers();if(!list[i])return;
  var np=prompt('Nuevo PIN / contraseña para '+(list[i].nombre||list[i].email)+' (mínimo 4 caracteres):',list[i].pin||'');
  if(np==null)return;
  np=String(np).trim();
  if(np.length<4)return alert('El PIN debe tener al menos 4 caracteres.');
  list[i].pin=np;saveAuthUsers(list);re();
  alert('✓ PIN actualizado.');
}
function setAuthRol(i,rol){
  if(!isCurrentAdmin())return;
  var list=getAuthUsers();if(!list[i])return;list[i].rol=rol;saveAuthUsers(list);re();
}
function toggleAuthUser(i){
  if(!isCurrentAdmin())return;
  var list=getAuthUsers();if(!list[i])return;list[i].habilitado=list[i].habilitado===false;saveAuthUsers(list);re();
}
function delAuthUser(i){
  if(!isCurrentAdmin())return;
  var list=getAuthUsers();if(!list[i])return;
  if(!confirm('¿Quitar a '+(list[i].nombre||list[i].email)+' de la lista? No podrá volver a ingresar.'))return;
  list.splice(i,1);saveAuthUsers(list);re();
}

function iaContext(){
  try{
    var c=calcAll();var e=emp();var cfg=e.cfg;var L=[];
    L.push('=== EMPRESA ACTIVA (usa SOLO estos datos) ===');
    L.push('Razón social: '+(cfg.razonSocial||'—')+' | NIT: '+(cfg.nit||'—')+' | Gestión: '+(cfg.gestion||'—'));
    L.push('Período: '+(cfg.fechaInicio||'')+' al '+(cfg.fechaFin||'')+' | UFV inicio: '+(cfg.ufvInicio||'—')+' | UFV fin: '+(cfg.ufvFin||'—'));
    L.push('');
    L.push('=== RESUMEN (Bs) ===');
    L.push('Total Ingresos: '+fmt(c.tI)+' | Total Gastos: '+fmt(c.tG)+' | '+(c.util>=0?'Utilidad':'Pérdida')+': '+fmt(Math.abs(c.util)));
    L.push('Total Activo: '+fmt(c.tA)+' (Corriente '+fmt(c.aC)+' / No Corriente '+fmt(c.aNC)+')');
    L.push('Total Pasivo: '+fmt(c.tP)+' | Patrimonio: '+fmt(c.tPT));
    L.push('Caja M/N: '+fmt(c.cajaMN)+' | Saldo final Flujo: '+fmt(c.sF));
    L.push('Cuadre → Balance: '+(c.bgOK?'OK':'NO ('+fmt(c.difBG)+')')+' | Sumas y Saldos: '+(c.ssOK?'OK':'NO')+' | Flujo: '+(c.fOK?'OK':'NO'));
    L.push('');
    L.push('=== SALDOS POR CUENTA (saldo ≠ 0) ===');
    Object.keys(c.M).filter(function(k){return c.gs(k)!==0;}).sort().forEach(function(k){
      L.push(k+' '+acctName(k)+': '+fmt(c.gs(k)));
    });
    try{
      var cxc=(typeof getCxC==='function')?(getCxC()||[]):[];
      var cxp=(typeof getCxP==='function')?(getCxP()||[]):[];
      if(cxc.length){L.push('');L.push('=== CUENTAS POR COBRAR ===');
        cxc.forEach(function(x){L.push('- '+(x.razon||'')+': '+fmt(pn(x.monto))+' ['+(x.estado||'pendiente')+(x.formaPago?'/'+x.formaPago:'')+']');});}
      if(cxp.length){L.push('');L.push('=== CUENTAS POR PAGAR ===');
        cxp.forEach(function(x){L.push('- '+(x.proveedor||x.razon||'')+': '+fmt(pn(x.monto))+' ['+(x.estado||'pendiente')+(x.formaPago?'/'+x.formaPago:'')+']');});}
    }catch(err){}
    try{
      var rcv=(e.rcvData||[]);
      if(rcv.length){var tot=rcv.reduce(function(s,r){return s+pn(r.total);},0);
        L.push('');L.push('=== RCV COMPRAS: '+rcv.length+' facturas, total Bs '+fmt(tot)+' ===');}
    }catch(err){}
    return L.join('\n');
  }catch(e){return 'No se pudo leer el contexto de la empresa: '+e.message;}
}

function calcProg(item){
  let p=0;
  if(item.razon)p++;if(item.nit)p++;if(item.gestion)p++;
  if(item.rcvOk)p++;if(item.ingOk)p++;if(item.afOk)p++;
  if(item.bgOk)p++;if(item.ssOk)p++;if(item.flujoOk)p++;
  if(item.estado==='terminado')p++;
  return Math.round(p/10*100);
}

function dashNum(x){
  var s=String(x==null?'':x).trim();
  if(s==='')return null;
  s=s.replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.').replace(/[^\d.\-]/g,'');
  if(s===''||s==='-'||s==='.')return null;
  var n=parseFloat(s);return isNaN(n)?null:n;
}

function autoFillUFV(){
  const cfg=emp().cfg;
  const fi=cfg.fechaInicio,ff=cfg.fechaFin;
  if(!fi||!ff||S.ufvData.length===0)return;
  // Search exact match
  const ufvI=S.ufvData.find(u=>u.fecha===fi||u.fecha===isoToLocal(fi));
  const ufvF=S.ufvData.find(u=>u.fecha===ff||u.fecha===isoToLocal(ff));
  if(ufvI){emp().cfg.ufvInicio=ufvI.ufv;console.log('UFV inicio auto:',ufvI.ufv);}
  if(ufvF){emp().cfg.ufvFin=ufvF.ufv;console.log('UFV fin auto:',ufvF.ufv);}
  saveLS();
}
function isoToLocal(iso){
  // Convert 2025-01-01 to 01/01/2025 for lookup
  if(!iso)return iso;
  const p=iso.split('-');
  if(p.length===3)return p[2]+'/'+p[1]+'/'+p[0];
  return iso;
}

function doPinLogin(){
  var em=normEmail((document.getElementById('pin-email')||{}).value);
  var pin=((document.getElementById('pin-pin')||{}).value||'');
  var err=document.getElementById('pin-err');
  if(!em||!pin){if(err)err.textContent='Ingresa correo y PIN.';return;}
  // Traer la lista de usuarios fresca de la nube antes de validar
  if(fbDb&&fbUser){
    if(err){err.style.color='#557363';err.textContent='Verificando…';}
    fbDb.collection('contax_config').doc('acceso').get().then(function(snap){
      try{if(snap.exists){var d=snap.data()||{};syncApplying=true;if(d.authusers)localStorage.setItem('cx_authusers',d.authusers);if(d.perms)localStorage.setItem('cx_perms',d.perms);syncApplying=false;}}catch(e){syncApplying=false;}
      if(err){err.style.color='#B42318';err.textContent='';}
      _finishPinLogin(em,pin,err);
    }).catch(function(){if(err){err.style.color='#B42318';err.textContent='';}_finishPinLogin(em,pin,err);});
  } else _finishPinLogin(em,pin,err);
}
function _finishPinLogin(em,pin,err){
  var u=authUserFor(em);
  if(!u){if(err)err.textContent='Este correo no está autorizado. Pide al administrador que te agregue.';return;}
  if(u.habilitado===false){if(err)err.textContent='Tu acceso está bloqueado. Contacta al administrador.';return;}
  if(!u.pin){
    // Usuario sin PIN (creado antes de esta versión): lo establece en este primer ingreso.
    if(pin.length<4){if(err)err.textContent='Aún no tienes PIN. Crea uno de al menos 4 caracteres para ingresar.';return;}
    var list=getAuthUsers();var idx=list.findIndex(function(x){return normEmail(x.email)===em;});
    if(idx>=0){list[idx].pin=pin;saveAuthUsers(list);u=list[idx];}
  } else if(String(u.pin)!==String(pin)){if(err)err.textContent='PIN incorrecto.';return;}
  setSession({username:u.email,email:u.email,nombre:u.nombre||u.email,rol:u.rol});
  localStorage.setItem('cu',u.nombre||u.email);
  if(typeof startPresence==='function')startPresence();
  re();
}
function setupFirstAdmin(){
  var nm=((document.getElementById('adm-nombre')||{}).value||'').trim();
  var em=normEmail((document.getElementById('adm-email')||{}).value);
  var pin=((document.getElementById('adm-pin')||{}).value||'');
  var err=document.getElementById('pin-err');
  if(!nm||!em||em.indexOf('@')<0||pin.length<4){if(err)err.textContent='Completa nombre, correo válido y un PIN de al menos 4 caracteres.';return;}
  var list=getAuthUsers();
  list.push({email:em,nombre:nm,rol:'Administrador',habilitado:true,pin:pin});
  saveAuthUsers(list);
  setSession({username:em,email:em,nombre:nm,rol:'Administrador'});
  localStorage.setItem('cu',nm);
  if(typeof startPresence==='function')startPresence();
  re();
}

function doFbLogin(){
  var em=(document.getElementById('fbl-email')||{}).value||'';
  var pw=(document.getElementById('fbl-pass')||{}).value||'';
  var errEl=document.getElementById('fbl-err');
  if(!em||!pw){if(errEl)errEl.textContent='Ingresa correo y contraseña.';return;}
  if(!fbAuth){if(errEl)errEl.textContent='No hay conexión con Firebase. Revisa tu internet.';return;}
  if(errEl){errEl.style.color='#557363';errEl.textContent='Ingresando…';}
  fbAuth.signInWithEmailAndPassword(em.trim(),pw).catch(function(e){
    var m=e.code==='auth/user-not-found'?'Este correo no está registrado.':
          e.code==='auth/wrong-password'?'Contraseña incorrecta.':
          e.code==='auth/invalid-email'?'Correo inválido.':
          (e.code==='auth/invalid-credential'||e.code==='auth/invalid-login-credentials')?'Correo o contraseña incorrectos.':
          e.code==='auth/too-many-requests'?'Demasiados intentos. Espera un momento.':e.message;
    if(errEl){errEl.style.color='#B42318';errEl.textContent=m;}
  });
}
function doFbRegister(){
  var nm=(document.getElementById('fbl-name')||{}).value||'';
  var em=(document.getElementById('fbl-email')||{}).value||'';
  var pw=(document.getElementById('fbl-pass')||{}).value||'';
  var errEl=document.getElementById('fbl-err');
  if(!nm||!em||!pw){if(errEl){errEl.style.color='#B42318';errEl.textContent='Completa nombre, correo y contraseña.';}return;}
  if(pw.length<6){if(errEl){errEl.style.color='#B42318';errEl.textContent='La contraseña debe tener al menos 6 caracteres.';}return;}
  if(!fbAuth){if(errEl)errEl.textContent='No hay conexión con Firebase.';return;}
  if(errEl){errEl.style.color='#557363';errEl.textContent='Creando cuenta…';}
  fbAuth.createUserWithEmailAndPassword(em.trim(),pw).then(function(c){
    return c.user.updateProfile({displayName:nm});
  }).catch(function(e){
    var m=e.code==='auth/email-already-in-use'?'Este correo ya tiene una cuenta. Inicia sesión.':
          e.code==='auth/invalid-email'?'Correo inválido.':
          e.code==='auth/weak-password'?'Contraseña muy débil (mínimo 6 caracteres).':e.message;
    if(errEl){errEl.style.color='#B42318';errEl.textContent=m;}
  });
}

function iaPickImage(input){
